    cn_font: 黑体
    latin_font: Times New Roman
    size: 三号
    align: center
    line: {rule: auto, value: 1.5}
  section_1:
    source: "规范（一）各节各级标题：小四号黑体；模板“1.1 引言”说明：二级标题，黑体，小四号；二、三级标题左对齐；行间距 1.5 倍（规范（二）4）；西文字体取模板示例格式（规范未作文字规定）"
    cn_font: 黑体
    latin_font: Times New Roman
    size: 小四
    align: left
    line: {rule: auto, value: 1.5}
  section_2:
    source: "规范（一）各节各级标题：小四号黑体；模板：二、三级标题左对齐；行间距 1.5 倍（规范（二）4）；西文字体取模板示例格式（规范未作文字规定）"
    cn_font: 黑体
    latin_font: Times New Roman
    size: 小四
    align: left
    line: {rule: auto, value: 1.5}
  body:
    source: "规范（一）：正文中中文内容小四号宋体，英文、数字小四号 Times New Roman 体；模板正文说明：首行缩进 2 字符，行间距为 1.5 倍；正文两端对齐"
