# 规范与模板合一：《东北大学秦皇岛分校本科生毕业设计（论文）撰写规范与模板》。
# 以下 source 中「规范」指该文件开头的（一）至（五）条文，「模板」指其后各部分的示例与括号内说明。

page:
  source: "规范（二）页面设置要求：奇数页上边距 30mm，下边距 25mm；页眉顶端距离 1.5cm，底端距离 1.75cm；纸张为模板示例（规范未作文字规定）"
  paper: A4
  # 左右边距奇偶页对调（奇数页左 30mm 右 20mm，偶数页左 20mm 右 30mm），schema 不能表达，只检查上下边距
  margins_cm: {top: 3.0, bottom: 2.5}
  header_distance_cm: 1.5
  footer_distance_cm: 1.75

page_numbers:
  source: "规范（三）：页码位于页脚中间；摘要和目录页码用罗马数字单独编排；论文页码从绪论部分开始至附录，用阿拉伯数字连续编排；规范（一）页码：五号，Times New Roman 体"
  front_format: upperRoman
  body_format: decimal
  footer_align: center
  footer_latin_font: Times New Roman
  footer_size: 五号

headers:
  source: "规范（二）1：页眉“东北大学秦皇岛分校本科生毕业设计（论文）”黑体，四号，居中"
  text: 东北大学秦皇岛分校本科生毕业设计（论文）
  align: center
  cn_font: 黑体
  size: 四号

