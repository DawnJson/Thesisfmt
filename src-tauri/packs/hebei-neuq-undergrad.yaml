    cn_font: 宋体
    latin_font: Times New Roman
    size: 五号
    align: center

checks:
  keywords:
    source: "模板关键词说明：关键词一般为 3～5 个，最后一个关键词后无标点符号；分号分隔取模板示例格式（规范未作文字规定）"
    min_count: 3
    max_count: 5
    zh_separator: "；"
    en_separator: ";"
  abstract_text:
    source: "模板摘要说明：篇幅以 300～500 字为宜（“为宜”，字数超出只作提示）"
    zh_min_chars: 300
    zh_max_chars: 500
    chars_approx: true
  caption_numbering:
    source: "模板图题、表题说明：图题编号为每章分开编写，按顺序编排，第一章从 1.1 起，第二章从 2.1 起；表序号为每章分开编写，第一章从 1.1 起"
  table_caption:
    source: "模板表题说明：表序号与表题置于表上居中"
  figure_caption:
    source: "模板图题说明：图题居中置于图下"
  table_lines:
    source: "模板表题说明：三线表格式如表所示，上下线宽 1.5 磅，中间线宽 0.5 磅，两边开口，表格居中"
    top_bottom_pt: 1.5
    header_pt: 0.5
  equation_number:
    source: "模板公式说明：公式的编号采用圆括号括起来放在公式右边行末，公式序号按章编排，如第 3 章第 2 个公式序号为“(3.2)”"
  chapter_number:
    source: "模板“1 绪论”说明：标题的阿拉伯数字编号之间用半角实心下圆点“.”相隔；章标题示例“1 绪论”"
  citations:
    source: "模板参考文献说明：参考文献按照全文中出现的前后次序排序；正文说明：参考文献在文中引用地方标注，并按顺序进行编号"

layout:
  new_page:
    source: "规范（三）4：各章之间加分页符"
    roles: [chapter]
  first_chapter_odd_page:
    source: "规范（三）4：绪论首页必须在奇数页码上"

manual:
  - {text: "左右页边距奇偶页对调：奇数页左 30mm、右 20mm，偶数页左 20mm、右 30mm。", source: "规范（二）2、3"}
  - {text: "封皮、郑重声明单面打印，从摘要开始双面打印。", source: "规范（四）"}
  - {text: "表格一页放不下时，下一页表格要包含表头，并在表格外上一行右上角写“表x.x（续表）”。", source: "规范（五）续表说明"}
  - {text: "各级标题处不得引用参考文献；绪论一般不少于 2000 字；参考文献中所有标点符号均为英文标点。", source: "模板“1 绪论”、“参考文献”说明"}
  - {text: "题目不超过 24 字；封面、郑重声明、摘要、目录等各部分的字体字号按模板括号内说明排版。", source: "模板封面等说明"}
