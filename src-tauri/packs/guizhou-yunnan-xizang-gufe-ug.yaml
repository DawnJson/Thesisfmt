    body_first: 1
manual:
- text: 中文摘要字数在 200 字左右；中、英文摘要的内容应严格一致；摘要前打印论文标题（主标题黑体三号居中，副标题楷体四号居中），英文标题 Times New Roman 四号加粗居中。
  source: 《贵州财经大学继续教育学院本科学位论文（设计）格式规范》中、英文摘要写作要求及格式
- text: “摘要：”“关键词：”标签为黑体小四、首行缩进 2 字符；“Abstract：”“Key words：”标签为 Times New Roman 小四加粗、首行缩进 2 字符。
  source: 《贵州财经大学继续教育学院本科学位论文（设计）格式规范》中、英文摘要写作要求及格式
- text: 各章之间应留 1 行的间隔（前一章结束后空 1 行，再打印后一章标题及正文）；纸型 A4、单面打印、左侧装订。（章标题段前段后各 1 行已由 roles 检查）
  source: 《贵州财经大学继续教育学院本科学位论文（设计）格式规范》1.1、1.6
- text: 公式序号按章编号，公式整行右对齐并使公式部分居中，序号在行末列出，如（2.1）。
  source: 《贵州财经大学继续教育学院本科学位论文（设计）格式规范》2.3.2
- text: 表格居中，表中附注按注1、注2顺序写在表下方；表头各栏居中，数字右对齐；表一旦超过一页要加续表（如“表2.5 续”），图超过一页使用续图。
  source: 《贵州财经大学继续教育学院本科学位论文（设计）格式规范》2.2.2、2.1.2
- text: 图居中、版式为“上下型”不得浮于文字之上；图与上下文之间各空一行。
  source: 《贵州财经大学继续教育学院本科学位论文（设计）格式规范》2.1.2
- text: 附录中的图、表、附注、参考文献、公式另行编号，如图A1、表B2。
  source: 《贵州财经大学继续教育学院本科学位论文（设计）格式规范》1.7
- text: 申请学位论文参考文献数量不少于 12 篇；参考文献著录格式遵照国家标准 GB/T 7714。
  source: 《贵州财经大学继续教育学院本科学位论文（设计）格式规范》参考文献、3
- text: 论文装订顺序：封面、声明及论文使用的授权、中英文摘要、目录、正文（含引言）、参考文献、附录（可选）、论文评审表。
  source: 《贵州财经大学继续教育学院本科学位论文（设计）格式规范》5
