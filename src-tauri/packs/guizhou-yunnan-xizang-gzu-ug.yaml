manual:
- text: 页眉文字为“贵州大学毕业论文（设计）　第　页”。封面和任务书不编页码。
  source: 《贵州大学毕业论文（设计）指南》4.4.5
- text: 摘要：毕业设计说明书中文摘要约 300 汉字；英文摘要与之对应；摘要中不宜使用公式、图表，不标注引用文献编号；摘要上方写论文题目（黑体小二号，居中，上空一行）；“关键词”居行首，黑体小三号。（论文摘要字数范围已由 abstract_text 检查）
  source: 《贵州大学毕业论文（设计）指南》4.2、4.4.3
- text: 章标题前空一行；分级阿拉伯数字编号一般不超过三级，两级之间用下角圆点隔开，每一级编号的末尾不加标点；目录标题一般写到三级，不出现四级。
  source: 《贵州大学毕业论文（设计）指南》4.4.2、4.4.4、4.4.5
- text: 表一律要求采用三线表，表的宽度不得超过版面文字宽度；表需转页接排时在随后各页重复表的编号，编号后跟表题（可省略）或“(续)”，如表1.2(续)。
  source: 《贵州大学毕业论文（设计）指南》4.4.6
- text: 公式应居中书写，公式编号用圆括号括起放在公式右边行末，公式与编号之间不加虚线。
  source: 《贵州大学毕业论文（设计）指南》4.4.12
- text: 注释用页末注，不用行中插注，且只限于写在注释符号出现的同页；引用文献标注在引用处正文右上角用[ ]和参考文献编号表明，字体用五号字。
  source: 《贵州大学毕业论文（设计）指南》4.4.11
- text: 参考文献按 GB 3469 标识文献类型；只著录前 3 位作者，第 4 位起用“，等”或“et al.”；理工农类不少于 10 篇，其他专业不少于 15 篇。
  source: 《贵州大学毕业论文（设计）指南》4.2.1、4.4.13
- text: 论文装订顺序：封面、诚信责任书、目录、中文摘要（含关键词）、英文摘要（含关键词）、正文、参考文献、致谢、附录、封底。
  source: 《贵州大学毕业论文（设计）指南》4.5
- text: 全文中的英文字符均采用 Times New Roman 字体；致谢正文、附录正文为宋体小四号。
  source: 《贵州大学毕业论文（设计）指南》4.4.4、4.4.9
