manual:
- text: 摘要、Abstract：页首空两行，标题下面空一行，空行段落段前、段后均 0，固定值 12 磅；“摘  要”二字之间加二个空格键。
  source: 写作模板注（摘要、Abstract）
- text: 关键词与上文空一行，冒号与中文关键词之间不空格，关键词之间加二个空格键；一行写不下时第二行第一个字与第一行冒号后的字对齐。英文关键词：冒号与第一个关键词之间空一个空格，关键词之间空二个空格，第二行第一个字母与第一行冒号后的字母对齐。
  source: 写作模板注（摘要、Abstract）
- text: 目录：页首空两行，标题下空一行（固定值 12 磅）；目录不作为一级标题，目录中无“目录”一项；一级标题顶格，二级标题空两个字符，三级标题空四个字符；“绪  论”“结  论”“致  谢”二字之间空二格。
  source: 写作模板注（目录）
- text: 每章页首空两行，章节标题下空一行，空行段落段前、段后 0，固定值 12 磅；标题“第x章”与后面文字空二个空格，X.X 与后面文字空一个格。
  source: 写作模板注（第1章）
- text: 图序及图名与下面文字之间空一行（空行段落段前后 0 行、固定值 22 磅），下面是标题则不空行；图与上面文字、图形与图序、表或图与页眉靠得很近时，加一空行设为段前、段后 0 行、固定值 12 磅。
  source: 写作模板注（图1-1）
- text: 表序及表名与上面文字之间空一行（空行段落段前后 0 行、固定值 22 磅），表的上方是标题则不空行；表格底线与下面正文靠得很近时加一空行，设为段前、段后 0 行、固定值 12 磅。
  source: 写作模板注（表2-1）
- text: 参考文献中的标点符号一律用英文状态下的标点；序号后的文字一行写不下时，第二行第一个字与上一行序号后的字对齐；英文参考文献按类型对应格式编写。
  source: 写作模板注（参考文献）
- text: 作者简介上面文字与下面文字之间空 10 行，设为段前、段后 0 行，固定值 22 磅；攻读硕士学位期间研究成果含发表论著、获奖项目、获专利。
  source: 写作模板注（作者简介、研究成果）
