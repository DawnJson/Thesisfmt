    size: 三号
  section_1:
    source: "办法第三十六条：第二层次（节）题序和标题用小三号黑体字；模板“2级标题，小三号黑体字”"
    cn_font: 黑体
    size: 小三
  section_2:
    source: "办法第三十六条：第三层次（条）题序和标题用四号黑体字；模板“3级标题，四号黑体字”"
    cn_font: 黑体
    size: 四号
  section_3:
    source: "办法第三十六条：第四及以下层次（款）题序和标题用小四号黑体字"
