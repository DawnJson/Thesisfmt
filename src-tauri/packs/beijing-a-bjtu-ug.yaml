# 北京交通大学本科毕业设计（论文）。依据：
#  (1)《北京交通大学本科毕业设计（论文）规范与质量抽检办法》第八章“格式规范”第三十六、三十七条（简称“办法”）；
#  (2) 教务处《附件3 毕设论文模板（论文主体）》中的文字说明与示例格式（简称“模板”）。
