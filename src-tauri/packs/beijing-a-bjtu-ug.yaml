checks:
  keywords:
    source: "办法第三十七条：摘要包括关键词（3 至 5 个）；模板：关键词以分号分隔（中文用“；”，英文用“;”，规范未区分全半角）"
    min_count: 3
    max_count: 5
    zh_separator: "；"
    en_separator: ";"
  caption_numbering:
    source: "办法第三十七条：正文，图表和公式要按章编号；模板：图的编号如“图2-1”，表如“表2-1”"
  table_caption:
    source: "模板：“表的编号和表题应置于表上方”"
  figure_caption:
    source: "模板：“图的编号和图题应置于图下方”"
  equation_number:
    source: "办法第三十七条：公式要按章编号；模板：“将编号置于括号内。公式的编号右端对齐”，示例“(2-1)”"
  appendix_number:
    source: "模板：“论文的附录依序用大写正体英文字母A、B、C……编序号，如：附录A”"
  continued_caption:
    source: "模板“表”说明：表转页接排时，在随后各页上重复表的编号，编号后跟表题（可省略）和“（续）”，置于表上方"
    style: suffix

layout:
  toc:
    source: "办法第三十七条：目录按三级标题编写，要求层次清晰，且与正文标题一致，主要包括摘要、正文主要层次标题、参考文献、附录等"
  table_span:
    source: "模板“表”说明：随后各页重复表的编号并加“（续）”；续表均应重复表头"

manual:
  - {text: "题目用小二号黑体字（分两行书写时用小一号）；题序和标题之间空1个字符，不加标点。", source: "办法第三十六条第2款"}
  - {text: "中文摘要字数应在400字左右，包括论文题目、论文摘要、关键词；英文摘要与中文摘要内容要相对应。", source: "办法第三十七条 摘要"}
  - {text: "表的编排建议采用国际通行的三线表。", source: "模板“表”说明"}
  - {text: "公式应另行起，并缩格书写，与周围文字留足够的空间区分开。", source: "模板“公式”说明"}
  - {text: "引文标注遵照 GB/T 7714，可采用顺序编码制，也可采用著者-出版年制，但全文必须统一；参考文献按标准格式书写，且要与论文工作直接相关。", source: "模板“引文标注”“参考文献”说明；办法第三十七条 参考文献"}
  - {text: "注释建议采用文中编号加“脚注”的方式，最好不采用尾注，且数量不宜过多。", source: "模板“注释”说明"}
  - {text: "论文主体组成及装订顺序：封面；论文诚信声明；论文使用授权书；中文摘要；英文摘要；目录；正文；参考文献；致谢；附录。正文文字应在15000字以上。", source: "办法第三十七条"}
  - {text: "涉及工程设计内容的，须全部符合相关国际国内行业标准、设计规范和政策法规，并在设计内容首页写明所符合的规范标准文号和名称。", source: "办法第三十六条第3款"}
