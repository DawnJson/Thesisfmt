# 曲阜师范大学研究生学位论文（2026届材料）
# 学校《研究生学位论文格式要求》只用文字规定了页面、行距、字体、图表位置、关键词、注释与参考文献；
# 标题、摘要、目录等格式只在三份“撰写格式范例”（理工类、文科类、专业学位）里给出，而三份范例互相不一致，
# 故只写学校文字规定的项目，范例中不一致的格式一律不设。
meta:
  id: shandong-qfnu-grad
  title: 曲阜师范大学研究生学位论文
  version: "2026"
  source: https://yjs.qfnu.edu.cn/info/1058/5197.htm
  valid_from: "2026"
  org: 曲阜师范大学
  kind: university
  category: 研究生
  verified: true

page:
  source: "《曲阜师范大学研究生学位论文格式要求》三、3：A4纸；页面边距：上2.5cm，下2.5cm，左2.5cm，右2cm；页脚：1.5cm"
  paper: A4
  margins_cm: {top: 2.5, bottom: 2.5, left: 2.5, right: 2.0}
  footer_distance_cm: 1.5

roles:
  body:
    source: "格式要求三、1、3：英文选用 Times New Roman 字体、行距为20磅；《撰写格式范例（理工类参考）》正文说明：正文宋体、五号（或小四号），段前段后0行，行间距20磅（字号二选一，故不设字号）"
    cn_font: 宋体
    latin_font: Times New Roman
    line: {rule: exact, value: 20}
    before: 0
    after: 0

checks:
  keywords:
    source: "格式要求二、4：在摘要的最后另起一行，相应注明本文的关键词3至5个；范例：中文关键词之间用“；”，英文关键词之间用“;”"
    min_count: 3
    max_count: 5
    zh_separator: "；"
    en_separator: ";"
  abstract_text:
    source: "格式要求二、4：英文摘要及关键词应与中文内容一致（字数按博士约2000、学术型硕士约1000、专业型硕士约800字，因学位类型而异，不设字数范围）"
    keywords_match: true
  caption_numbering:
    source: "格式要求二、6：论文中的图、表应按章（单元）顺序编号，如图2-3为第二章第3个图"
  table_caption:
    source: "格式要求二、6：正文中图表标题的标注位置应为图下表上"
  figure_caption:
    source: "格式要求二、6：正文中图表标题的标注位置应为图下表上"
  footnotes:
    source: "格式要求二、7：注释一般排印在该页地脚；注释用数字加圆圈标注（如①、②…）"
    circled: true
  citations:
    source: "格式要求二、7：参考文献按在正文中出现的先后次序列表于正文后；序号左顶格，用数字加方括号表示，如［1］、［2］，以与正文中的指示序号格式一致"

layout:
  new_page:
    source: "格式要求二、4：外文摘要另起一页打印"
    roles: [abstract_title_en]

manual:
  - {text: "图、表应居中排版，图表标题字号应比正文小一号。", source: "格式要求二、6"}
  - {text: "论文统一按 Word 格式 A4 纸排版（“页面设置”按 Word 默认值），字符间距为标准，双面打印，左侧胶装。", source: "格式要求三、3"}
  - {text: "中文摘要字数：博士学位论文2000字左右，学术型硕士1000字左右，专业型硕士800字左右；论文第一页为中文摘要，外文摘要另起一页。", source: "格式要求二、4"}
  - {text: "目录：章节的标题只列到节，所标页码应与正文一致。", source: "格式要求二、5"}
  - {text: "参考文献数量：博士100个以上，学术型硕士30个以上，专业型硕士20个以上，其中要有一定的外文文献，外文文献按作者姓名字母顺序排列；每一条参考文献末尾以“.”结束，著录格式按文中各类文献示例。", source: "格式要求二、7"}
  - {text: "参考文献表上以“参考文献：”（左顶格）或“［参考文献］”（居中）作为标识。", source: "格式要求二、7"}
  - {text: "论文题目一般不超过20个汉字；论文封面、扉页、声明页按《撰写格式范例》，学位论文原创性声明和授权使用声明放置于同一页。", source: "格式要求二、1-3"}
  - {text: "标题、摘要、目录等的字体字号以《撰写格式范例》为准（理工类、文科类、专业学位三份范例的设置不一致，程序不检查）。", source: "格式要求三、3"}
