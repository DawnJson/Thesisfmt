manual:
  - {text: "页眉：除封面及内封外各页加页眉，在版芯上边线隔一行加粗、细双线（粗线在上，宽 0.8mm），双线上居中打印页眉；奇数页眉本章的题序及标题，偶数页眉为“华北电力大学博士学位论文”。", source: "《博士学位论文撰写规范》3.4"}
  - {text: "摘要字数（以汉字计）博士学位论文 1000～2000 字；摘要页不需写出论文题目；英文摘要与中文摘要内容应完全一致；摘要中不宜使用公式、化学结构式、图表和非公知公用的符号和术语，不标注引用文献编号。", source: "《博士学位论文撰写规范》2.3、1.3.1"}
  - {text: "博士学位论文的扉页、摘要、目录、图题及表题等，都要求用中、英文两种文字给出，中文在前；博士生需加英文目录（英文目录各章题序及标题 Times New Roman 4 号加粗，其余 Times New Roman 小 4 号）。", source: "《博士学位论文撰写规范》2.2、2.4、3.6"}
  - {text: "中文摘要关键词在正文之后隔一行顶格书写；英文摘要的关键词用小写。", source: "《博士学位论文撰写规范》3.5"}
  - {text: "目录应包括全部章、节、条三级标题及页号；一级标题顶格书写，二级标题缩进一格，三级标题缩进两格。", source: "《博士学位论文撰写规范》2.4"}
  - {text: "章标题字数一般在 15 字以内，一般不加标点符号；各层次题序及标题不得置于页面的最后一行（孤行）。", source: "《博士学位论文撰写规范》2.5.1、3.7"}
  - {text: "表格不加左、右边线，建议采用三线表；表名中不允许使用标点符号，表序与表名之间空一格；续表在随后各页重复表的编号，编号后加“（续表）”，表题可省略，续表应重复表头。", source: "《博士学位论文撰写规范》2.12"}
  - {text: "图名在图序之后空一格排写；图注或其他说明置于图题之上；插图之前文中必须有提示（如“见图1-1”）；插图与其图题不得拆开排写于两页。", source: "《博士学位论文撰写规范》2.13.1、2.13.2"}
  - {text: "公式原则上应居中书写，公式末不加标点；公式较长时在等号处转行，运算符号仅书写于转行式前。", source: "《博士学位论文撰写规范》2.11、3.8"}
  - {text: "博士学位论文的参考文献数一般不少于 100 篇，其中外文文献一般不少于总数的 1/2；近五年的文献一般应不少于总数的 1/3，并应有近两年的参考文献。", source: "《博士学位论文撰写规范》1.6"}
  - {text: "每章应另起一页之外：论文主体各章后应有一节“本章小结”；结论作为正文最后一章单独排写，内容一般在 2000 字以内。", source: "《博士学位论文撰写规范》1.5.2、1.5.3"}
