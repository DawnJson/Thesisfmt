  page_start:
    source: "规范3.3：页码从正文开始按阿拉伯数字（1，2，3……）连续编排，之前的部分用大写罗马数字（Ⅰ，Ⅱ，Ⅲ……）单独编排"
    front_first: 1
    body_first: 1

manual:
  - {text: "装订线 0.5 cm。", source: "表4.1 页面设置"}
  - {text: "英文摘要一般为 300 个左右实词；关键词之外另注分类号（《中国图书馆分类法》第四版，1-2个，分号分隔）。", source: "模板摘要、Abstract 说明"}
  - {text: "章、节编号全部顶格排，序号与一至三级标题之间一个汉字（英文空格需两个）；段落和标题之间空一行；通常设置三级标题，不提倡使用三级以上标题。", source: "规范2.1、3.2.1"}
  - {text: "图序、图题（表序、表题）间空一个汉字（英文空格需两个）；图的版式建议“上下型”“居中”；表格必须通栏，即表格宽度与正文版面平齐；表中参数应标明量和单位的符号。", source: "规范3.4.1、3.4.2"}
  - {text: "附录中的公式、图和表的编号分别用 A1，A2…系列；图 A1，图 A2…系列；表 A1，表 A2…系列；每个附录应有标题。", source: "规范2.10"}
  - {text: "公式应另起一行，左起空两个字编排；较长的公式尽可能在等号后换行，或在“+”“-”等符号后换行；公式号写在右边行末，中间不加虚线；“式中：”单独占一行，释文空两个字排，用破折号与释文连接。", source: "规范3.4.3 表达式"}
  - {text: "参考文献：按 GB 7714 著录；作者不超过 3 位时全部列出，超过 3 位只列前 3 位，后加“等”字或相应外文；学术型硕士不少于 60 篇（外文一般不少于 20 篇），专业硕士一般不少于 30 篇（外文一般不少于 10 篇）；近五年文献一般不少于总数的 1/3，并应有近两年的参考文献；正文引用须用上标标注。", source: "规范2.9；模板参考文献说明"}
  - {text: "论文字数：学术型硕士一般不少于 3 万字，专业硕士一般不少于 2 万字。", source: "规范3.1"}
  - {text: "论文从中文摘要至附录部分双面印刷，其他部分单面印刷；学硕、专硕封面颜色不同；用线装或热胶装订，不能使用钉子装订。", source: "规范4.2"}
