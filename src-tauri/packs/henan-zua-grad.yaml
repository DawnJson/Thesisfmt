checks:
  keywords:
    source: "模板摘要：关键词（3-8个），以分号分隔；英文关键词与关键词之间用“;”隔开"
    min_count: 3
    max_count: 8
    zh_separator: "；"
    en_separator: ";"
  abstract_text:
    source: "模板Abstract：英文摘要内容必须与中文摘要完全对应；英文关键词内容必须与中文关键词完全对应；模板摘要：中文摘要约300~600字左右"
    zh_min_chars: 300
    zh_max_chars: 600
    chars_approx: true
    keywords_match: true
  caption_numbering:
    source: "规范3.4.1：图序一律采用阿拉伯数字分章编号，第3章第2个图的图序为“图 3.2”；规范3.4.2：表序分章编号，如“表3.1”"
  table_caption:
    source: "规范3.4.2：表标题……居中排于表的上方"
  figure_caption:
    source: "规范3.4.1：图标题……居中排于图的下方"
  table_lines:
    source: "规范3.4.2：表的编排建议采用国际通行的三线表；上线条和下线条为1.5磅，中间线为0.5磅"
    top_bottom_pt: 1.5
    header_pt: 0.5
  continued_caption:
    source: "规范3.4.2：表格较大、需要转页排时，需在续表上方居中注明“续表”，续表的表头应重复排出"
  equation_number:
    source: "规范3.4.3 公式：公式后应注明编号，公式号应置于小括号中，如公式(2-3)，写在右边行末"
  chapter_number:
    source: "规范3.2.1：各层次标题一律用阿拉伯数字连续编号，如“1”，“2.1”，“3.1.2”"
  appendix_number:
    source: "规范2.10：附录的序号用A，B，C…系列，如附录A，附录B…；模板：论文的附录依序用大写正体英文字母A、B、C……编序号"
  figure_citation:
    source: "规范3.4.1：图在文中的布局要合理，一般随文编排，先见文字后见图"
  citations:
    source: "规范2.9：参考文献应按文中引用出现的顺序排列，按顺序编码制；模板参考文献：以文献在整个论文中出现的次序用[1]、[2]、[3]……统一排序"
  footnotes:
    source: "规范2.8：用“脚注”的方式标注在当前页的下方，建议采用阿拉伯数字编号；模板注释脚注：每页单独编号"
    restart_each_page: true

