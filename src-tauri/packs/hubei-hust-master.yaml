manual:
- text: 本规则包依据生命学院发布的《华中科技大学学位论文参考模板》（2024年9月版）正文中的说明文字及其示例排版，未找到华中科技大学研究生院的统一格式规范文字，故未标记为已核实。
  source: https://life.hust.edu.cn/info/1858/4742.htm
- text: 页眉内容为“华中科技大学硕士学位论文”，模板为居中的静态文字；页眉字体取“华文楷体”，模板实际字号约 16.5 磅，与规范“小二”（18 磅）不一致，以规范为准。
  source: 模板第 1 章“论文页眉，楷体，小二”
- text: 学位论文表格要使用三线格并居中放置；规范未给线宽。
  source: 模板 4.2“学位论文中的表格要使用三线格，居中放置”
- text: 图一般居中放置，宽度不得超过文字边缘；图中文字缩放后字号不得大于五号；图像分辨率尽量不低于 300 dpi；说明字体与比例尺的字体应至少比正文小一号。
  source: 模板 4.1 关于图
- text: 公式居中排列，公式编号按章顺序编排（如第 2 章第 3 个公式标注为 2-3）并右对齐；模板示例写作“（2.1）”，与此处写法不一致，未作自动检查。
  source: 模板 4.6.2 公式
- text: 表格题目与表格尽量不要分页；实在需要分页时，请在下一页续表。
  source: 模板 4.2 关于表格
- text: 目录自动生成时，只需列出二级标题（有需要可列三级标题）。
  source: 模板“目录编写要求：1.”
- text: 硕士学位论文的字数一般不少于 2.5 万字，从绪论到总结与展望的总页数一般不少于 65 页；主体研究内容不得少于 2 章，加上绪论、总结与展望，累计不得少于 5 章。
  source: 模板第 1 章绪论、1.4 本文主要内容
- text: 硕士学位申请人的文献阅读量一般不少于 40 篇，其中外文文献一般不少于 1/3，近五年的论文一般不少于 1/3。
  source: 模板《参考文献》
- text: 题名一般不宜超过 30 个字；摘要及全文中均建议不出现“我们、本文”等字样。
  source: 模板第 1 章；摘要要求 5)
