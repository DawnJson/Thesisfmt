checks:
  keywords:
    source: "规范第 1.2.4 节：关键词 3~5 个，用分号隔开；第 2.3 节：英文段落统一使用半角符号"
    min_count: 3
    max_count: 5
    zh_separator: "；"
    en_separator: ";"
  caption_numbering:
    source: "规范第 2.4 节：图、表采用阿拉伯数字分章连续编号，例如“图 2-5”“表 3-2”"
  table_caption:
    source: "规范第 2.4.2 节：每个表应有简短确切的表题，五号字，居中置于表的正上方"
  figure_caption:
    source: "规范第 2.4.1 节：每个图应有简短确切的图题，五号字，居中置于图的正下方"
  table_lines:
    source: "规范第 2.4.2 节：表格采用三线表样式，上下边线线宽 1.5 磅，表内线条线宽 0.75 磅"
    top_bottom_pt: 1.5
    header_pt: 0.75
  table_cell:
    source: "规范第 2.4.2 节：表内文字五号字、单倍行距、上下居中；表 2-2 表格 五号 居中"
    cn_font: 宋体
    latin_font: Times New Roman
    size: 五号
    align: center
    line: {rule: auto, value: 1.0}
  equation_number:
    source: "规范第 2.5 节：公式采用阿拉伯数字分章连续编号，编号标注于公式所在行最右端，不加引导线，如“(2-1)”“式(5-1)”"
  abstract_text:
    source: "规范第 1.2.4 节：博士论文中文摘要一般不超过 1500 字，最多不超过 2 页；摘要中不宜使用图、表、公式；英文关键词应与中文关键词对应；第 2.3 节：英文段落统一使用半角符号"
    zh_max_chars: 1500
    no_figures: true
    en_punctuation: true
    keywords_match: true
  appendix_number:
    source: "规范第 1.5 节表 1-1：附录（附录 A，附录 B……）"
  continued_caption:
    source: "规范第 2.4.2 节：续表应在表题结尾以“（续）”注明，如“表 3-2 加入激素后的实验结果比较（续）”"
    style: suffix
  figure_citation:
    source: "规范第 2.4 节：在图、表紧邻的前文中，须有相应提示，例如“如图 2-5 所示”“见表 3-2”"
  citations:
    source: "规范第 2.10.1 节：采用顺序编码制，按正文中引用文献出现的先后顺序连续编码；第 2.10 节：引用过的文献必须著录，未引用的文献不得虚列"
  footnotes:
    source: "规范第 2.3 节表 2-2：脚注 小五 两端对齐 段前后 0 磅；未注明字体的按“中文宋体，英文、数字 Times New Roman”"
    format:
