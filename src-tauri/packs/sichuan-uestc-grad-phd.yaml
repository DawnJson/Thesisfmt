  table_span:
    source: "规范第 2.4.2 节：表格仅当一页内编排不下时才可转页，以续表形式接排，续表应重复表头和关于单位的陈述，并在表题结尾以“（续）”注明"
  new_page:
    source: "规范第 1.2.4 节：英文摘要另起一页书写；第 3.4 节：第一章的最后一页为第 17 页，则第二章的第一页在第 17 页的背面印刷，页码为“18”（章从新的一页开始）"
    roles: [abstract_title_en, chapter]
  page_limits:
    - {role: abstract_title_zh, max_pages: 2, source: "规范第 1.2.4 节：博士论文中文摘要一般不超过 1500 字，最多不超过 2 页"}
    - {role: ack_title, max_pages: 1, source: "规范第 1.4.1 节：致谢一般不超过 800 字，最多不超过 1 页"}
  page_start:
    source: "规范第 2.12.2 节：前置部分用罗马数字从“Ⅰ”开始，第一章第 1 页起用阿拉伯数字从“1”开始"
    front_first: 1
    body_first: 1
  ref_entry_page:
    source: "规范第 2.10.2 节说明（1）：参考文献不跨页编排，即一条文献所在段中不分页"

manual:
  - {text: "章序用中文数字（第一章、第二章……），次级标题的节序用阿拉伯数字，序号与名称之间空 1 个半角字符；标题不超过一行，标题中不加标点符号。", source: "规范第 2.2 节"}
  - {text: "页眉线为单横线，线宽 0.75 磅。", source: "规范第 2.12.1 节"}
  - {text: "中文摘要及之后的前置部分，页眉为各部分内容的标题（“摘要”“ABSTRACT”“目录”“图目录”“表目录”“主要符号表”“缩略词表”）；从第一章第 1 页起奇数页页眉用本章标题，偶数页页眉用“电子科技大学博士学位论文”。", source: "规范第 2.12.1 节"}
  - {text: "超过一行的图题、表题两端对齐，左右缩进 4 字符；分图序号用 (a)、(b)、(c)，置于对应分图正下方；图和图题须编排在同页，图题不得跨页。", source: "规范第 2.4.1、2.4.2 节"}
  - {text: "引用文献中的图、表时，除在正文中标注参考文献序号外，还须在图题、表题的右上角标注参考文献序号。", source: "规范第 2.4 节"}
  - {text: "公式另起一行居中书写；公式下面的“式中”两字左起顶格编排，解释与解释之间用分号隔开。", source: "规范第 2.5 节"}
  - {text: "各级标题不得置于页面最后一行，须与下段同页；两个标题之间无正文时，第二个标题的段前距设为 0 磅；只有一、两行文字的不得单独作为一页内容。", source: "规范第 2.3 节“其他要求”（1）（2）（4）"}
  - {text: "关键词与摘要正文之间空一行顶格书写；关键词超过一行时换行后悬挂缩进对齐；英文关键词每个单词首字母大写。", source: "规范第 1.2.4 节"}
  - {text: "目录内容从“第一章”开始至论文最后一页，不包含摘要、缩略词表等前置部分。", source: "规范第 1.2.5 节"}
  - {text: "参考文献编号和内容之间空 1~3 个半角字符；作者最多写到第 3 位，余者用“, 等”或“, et al”代替；文献标注按 GB/T 7714-2015。", source: "规范第 2.10.2 节说明（2）（4）"}
  - {text: "中文摘要之前的前置部分（封面，中、英文扉页，独创性声明及论文使用授权页）单面印刷；中文摘要及之后的前置部分双面印刷，某部分页数为奇数时其最后一页单面印刷；正文起所有页面双面印刷。", source: "规范第 3.4 节"}
