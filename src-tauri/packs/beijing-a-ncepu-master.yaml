# 依据：《华北电力大学硕士学位论文撰写规范》（研究生院，2024 年 6 月，下称「规范」）。
page:
  source: "规范 3.9：标准 A4 幅面白纸，页边距为上 3 厘米、下 2.7 厘米、左 3 厘米、右 3 厘米（包括页眉、页码）"
  paper: A4
  margins_cm: {top: 3.0, bottom: 2.7, left: 3.0, right: 3.0}

page_numbers:
  source: "规范 2.18：封面、中英文扉页、原创性声明和使用授权书不编入页码；摘要、目录等用小五号罗马数字编连续码，正文起用小五号阿拉伯数字编连续码，页码位于页脚居中；3.1：数字、英文字体为 Times New Roman"
  front_format: upperRoman
  body_format: decimal
  footer_align: center
  footer_latin_font: Times New Roman
  footer_size: 小五
  cover_no_number: true

# 页眉固定为“华北电力大学硕士学位论文”，不随章变化。
headers:
  source: "规范 3.4：除封面及内封外各页均加页眉，居中打印，小 5 号宋体，硕士学位论文页眉均为“华北电力大学硕士学位论文”"
  text: "华北电力大学硕士学位论文"
  align: center
  cn_font: 宋体
  size: 小五

roles:
  chapter:
    source: "规范 3.2：章标题黑体小 2 号，段前 1 行、段后 0.5 行；3.7：章序及章名居中排，章序用阿拉伯数字"
    cn_font: 黑体
    latin_font: Times New Roman
    size: 小二
    align: center
    before_lines: 1
    after_lines: 0.5
  section_1:
    source: "规范 3.2：节标题黑体小 3 号，段前 0.5 行、段后 0.5 行"
    cn_font: 黑体
    latin_font: Times New Roman
    size: 小三
    before_lines: 0.5
    after_lines: 0.5
  section_2:
    source: "规范 3.2：条标题黑体 4 号，段前 0.5 行、段后 0.5 行"
    cn_font: 黑体
    latin_font: Times New Roman
    size: 四号
    before_lines: 0.5
    after_lines: 0.5
  section_3:
    source: "规范 3.2：款、项标题黑体小 4 号"
    cn_font: 黑体
    latin_font: Times New Roman
    size: 小四
  body:
    source: "规范 3.1：中文宋体，数字、英文 Times New Roman；3.2：正文宋体小 4 号，行距多倍行距值 1.25"
    cn_font: 宋体
    latin_font: Times New Roman
    size: 小四
    line: {rule: auto, value: 1.25}
  abstract_title_zh:
    source: "规范 3.5.1：摘要题头居中，“摘    要”小 2 号黑体"
    cn_font: 黑体
    size: 小二
    align: center
  abstract_title_en:
    source: "规范 3.5.2：英文摘要书写格式与中文相同（题头居中、小 2 号）"
    size: 小二
    align: center
  keywords_zh:
    source: "规范 3.5.1：关键词 3～5 个（宋体小 4 号），“关键词”三字黑体小 4 号（两部分字体不同，仅检查字号）"
    size: 小四
  toc_chapter:
    source: "规范 3.6：目录中各章题序及标题用黑体小 4 号字；3.1：数字、英文 Times New Roman"
    cn_font: 黑体
    latin_font: Times New Roman
    size: 小四
  toc_item:
    source: "规范 3.6：目录其余用宋体小 4 号字；3.1：数字、英文 Times New Roman"
    cn_font: 宋体
    latin_font: Times New Roman
    size: 小四
  fig_caption:
    source: "规范 2.13.1：图题置于图下，用中文宋体 5 号字排写"
    cn_font: 宋体
    latin_font: Times New Roman
    size: 五号
  table_caption:
    source: "规范 2.12：表题置于表上，用中文宋体 5 号字居中排写"
    cn_font: 宋体
    latin_font: Times New Roman
    size: 五号
    align: center

checks:
  keywords:
    source: "规范 1.3.2：应列取 3~5 个关键词；3.5.1：关键词“（词）；（词）；…”，用分号；3.5.2：英文关键词示例“Keywords：×××，×××，…”用逗号"
    min_count: 3
    max_count: 5
    zh_separator: "；"
    en_separator: "，"
  abstract_text:
    source: "规范 2.3：摘要的字数（以汉字计），硕士学位论文一般为 500～1000 字；1.3.1：摘要中不宜使用公式、化学结构式、图表"
    zh_min_chars: 500
    zh_max_chars: 1000
    no_figures: true
  caption_numbering:
    source: "规范 2.12：表序一般按章编排，如第 1 章第一个插表的序号为“表 1-1”；2.13.1：图序按章编排，如“图 1-1”"
  table_caption:
    source: "规范 2.12：表题置于表上"
  figure_caption:
    source: "规范 2.13.1：图题置于图下"
  figure_citation:
    source: "规范 2.13.2：插图之前，文中必须有关于本插图的提示，如“见图 1-1”、“如图 1-1 所示”"
  table_cell:
    source: "规范 2.12：表中文字用宋体 5 号字；3.1：数字、英文 Times New Roman"
    cn_font: 宋体
    latin_font: Times New Roman
    size: 五号
  equation_number:
    source: "规范 2.11：公式序号按章编排，如第 1 章第一个公式序号为“(1-1)”；3.8：公式序号置于括号内，右端对齐"
  chapter_number:
    source: "规范 3.7：章序及章名居中排，章序用阿拉伯数字（第 1 章）"
  citations:
    source: "规范 2.6：引文标注采用顺序编码制；1.6：所有被引用文献均要列入参考文献，必须按顺序标注，同一篇文章只用一个序号"

layout:
  toc:
    source: "规范 2.4：目录应包括论文中全部章、节、条三级标题及其页号"
  new_page:
    source: "规范 2.5.1：论文正文分章节撰写，每章应另起一页"
    roles: [chapter]
  first_chapter_odd_page:
    source: "规范 3.9：绪论起始页为奇数页"

manual:
  - {text: "学位论文页眉在版芯上边线隔一行加粗、细双线（粗线在上，宽 0.8mm），双线上居中打印页眉。", source: "规范 3.4"}
  - {text: "表格不加左、右边线，建议采用国际通行的三线表；表序与表名之间空一格，表名中不允许使用标点符号，表名后不加标点。", source: "规范 2.12"}
  - {text: "表需转页接排时，在随后各页重复表的编号，编号后加“（续表）”，表题可省略，续表应重复表头。", source: "规范 2.12"}
  - {text: "图名在图序之后空一格排写；图注或其他说明置于图题之上；图中文字和数字用宋体 5 号字；插图与其图题为一个整体，不得拆开排写于两页。", source: "规范 2.13、2.13.1、2.13.2"}
  - {text: "公式原则上居中书写，公式末不加标点；文中引用公式时用“见式 (1-1)”或“由公式 (1-1)”。", source: "规范 2.11、3.8"}
  - {text: "各章标题字数一般在 15 字以内，一般不加标点符号；论文主体各章后应有一节“本章小结”；结论内容一般在 2000 字以内。", source: "规范 1.5.2、1.5.3、2.5.1"}
  - {text: "引用文献标示置于所引内容最后一个字的右上角，编号用阿拉伯数字置于方括号中，小 4 号字上角标；不得将引用文献标示置于各级标题处。", source: "规范 2.6"}
  - {text: "硕士学位论文参考文献一般不少于 40 篇，其中外文文献一般不少于总数的 1/2，近五年的文献数一般不少于总数的 1/3，并应有近两年的参考文献。", source: "规范 1.6"}
  - {text: "参考文献序号左顶格，用方括号数字表示；每一条目最后不用加结束符；作者 3 人及以下全部列出，3 人以上列前 3 人后加“等”或“et al”。", source: "规范 2.14 参考文献著录标准及格式"}
  - {text: "封面、扉页：封面“学术/专业硕士学位论文”宋体小 1 号加粗，论文题目黑体 2 号，姓名与日期宋体小 2 号加粗；扉页冒号左侧黑体 4 号、右侧宋体 4 号，多倍行距 1.5；硕士学位论文使用深蓝色封面。", source: "规范 3.3、3.9"}
  - {text: "论文摘要不需写出论文题目；英文摘要与中文摘要内容应完全一致；英文摘要关键词用小写。", source: "规范 2.3、3.5.2"}
  - {text: "封面、中英文扉页、原创性声明和使用授权书单面印刷，从中文摘要开始双面印刷。", source: "规范 3.9"}
