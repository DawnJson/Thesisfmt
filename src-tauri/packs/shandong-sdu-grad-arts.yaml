checks:
  keywords:
    source: "《山东大学学位论文规范（试行）》（山大研字〔2006〕53号）三（五）并在摘要后列出 3-5 个关键词，之间用分号相隔；英文关键词分隔符取模板《山东大学硕士学位论文模板-人文社科类.docx》示例格式（规范未作文字规定）"
    min_count: 3
    max_count: 5
    zh_separator: "；"
    en_separator: ";"
  caption_numbering:
    source: "模板《山东大学硕士学位论文模板-人文社科类.docx》示例格式（规范未作文字规定）（图、表题注按章编号，如“表 1-1”“图 1-1”）"
  abstract_text:
    source: "《山东大学学位论文规范（试行）》（山大研字〔2006〕53号）三（六）并在其后列出与中文相对应的外文关键词"
    keywords_match: true
  continued_caption:
    source: "模板《山东大学硕士学位论文模板-人文社科类.docx》示例格式（规范未作文字规定）（示例含“续表 1-2”与重复表头）"

manual:
  - {text: "页眉文字为“山东大学博（硕）士学位论文”，须按所攻读学位核对。", source: "《山东大学学位论文规范（试行）》（山大研字〔2006〕53号）三（八）"}
  - {text: "正文一般每行 32～34 字，每页 29～31 行。", source: "《山东大学学位论文规范（试行）》（山大研字〔2006〕53号）三（八）"}
  - {text: "章、节、目的标题应简明扼要、体现阐述内容的重点，无标点符号。", source: "《山东大学学位论文规范（试行）》（山大研字〔2006〕53号）三（八）"}
  - {text: "摘要字数：硕士学位论文摘要 1000 字左右，博士学位论文摘要 3000 字以上。", source: "《山东大学学位论文规范（试行）》（山大研字〔2006〕53号）一、学位论文的基本要求"}
  - {text: "须有中、外文目录各一份；外文目录标题字用加重小三号字体大写字母，目录内容用小四号字体小写字母；外文摘要标题用大写字母，摘要内容用小四号字体小写字母。", source: "《山东大学学位论文规范（试行）》（山大研字〔2006〕53号）三（四）、三（六）"}
  - {text: "论文封面采用研究生院统一印制的封面，中、外文题目均需标示；中文题目小二号加重黑体，外文题目三号加重；论文题目不得超过 30 个汉字。", source: "《山东大学学位论文规范（试行）》（山大研字〔2006〕53号）三（一）"}
  - {text: "参考文献按文中使用的顺序列出，并注明作者、题名、刊物（出版社）名称、出版时间、页码等；理学、工学、医学类按国际惯例执行。", source: "《山东大学学位论文规范（试行）》（山大研字〔2006〕53号）三（十）"}
  - {text: "人文社科类学位论文应有详细的引文出处，格式应规范，一般标注于每一页下方（脚注）或每一章节结尾。", source: "《山东大学学位论文规范（试行）》（山大研字〔2006〕53号）三（十）"}
