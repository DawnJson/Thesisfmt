checks:
  keywords:
    source: "格式模板关键词说明：关键词数量3至5个；每一个关键词之间用“；”隔开；英文关键词之间的“;”取自模板示例"
    min_count: 3
    max_count: 5
    zh_separator: "；"
    en_separator: ";"
  caption_numbering:
    source: "格式模板图名的写法（1）、表名的写法（1）：编号时应以章为单位顺序编号，如图1.1、图1.2；表1.1、表1.2"
  table_caption:
    source: "格式模板表名的写法（1）：表名应当在表的上方并且居中"
  figure_caption:
    source: "格式模板图名的写法（1）：图名居中并位于图下"
  table_cell:
    source: "格式模板表名的写法（4）：表内文字全文统一，设置为宋体，5号"
    cn_font: 宋体
    size: 五号
  chapter_number:
    source: "格式模板一级标题：用1、2、3…表示（章序号用阿拉伯数字）"

layout:
  new_page:
    source: "格式模板参考文献说明：参考文献单独一页"
    roles: [references_title]

manual:
  - {text: "提交论文时删除模板中所有红色提示内容；专升本层次论文主体要求8000字以上，高起专层次5000字以上。", source: "格式模板首页"}
  - {text: "摘要字数控制在300字左右；关键词与摘要内容空一行；专业名称不可以作为关键词。", source: "格式模板摘要说明"}
  - {text: "目录要写完论文后自动生成；注意参考文献和致谢的排版顺序。", source: "格式模板目录说明"}
  - {text: "图及其名称、表及其名称要放在同一页中，不能跨接两页；表格居中排列；表格与下文应留一行空格；表名与上文留一空行。", source: "格式模板图名、表名的写法"}
  - {text: "表中若有附注，一律用阿拉伯数字和右半圆括号按顺序编排，如注1），附注写在表的下方。", source: "格式模板表格说明（3）"}
  - {text: "参考文献单独一页，要求近五年文献，需包含中文、外文文献，数量不少于10篇，格式符合 GB/T 7714-2015。", source: "格式模板参考文献说明"}
  - {text: "致谢字数在300字左右；附录为可选内容，置于致谢之后，多个附录按“附录A”“附录B”等顺序排列。", source: "格式模板致谢、附录说明"}
  - {text: "页边距、页眉页脚、页码格式模板与通知均无文字规定，未设检查。", source: "格式模板、继续教育学院通知"}
