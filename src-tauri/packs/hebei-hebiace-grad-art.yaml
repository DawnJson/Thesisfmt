    roles: [chapter, abstract_title_en]

manual:
  - {text: "页眉：除封面及内封外各页均加页眉，页眉线 0.5pt；前置部分页眉为本章标题，正文部分奇数页眉为本章的题序及标题，偶数页眉为“河北建筑工程学院硕士学位论文”。", source: "《河北建筑工程学院研究生学位论文撰写规范（试行）》3.5"}
  - {text: "摘要页不需写出论文题目；英文摘要与中文摘要的内容应完全一致；摘要中不宜使用公式、图表，不标注引用文献编号。", source: "《河北建筑工程学院研究生学位论文撰写规范（试行）》1.3.1、2.3、3.6"}
  - {text: "中文关键词在摘要正文之后隔一行顶格书写；“关键词”三字用小 4 号黑体。", source: "《河北建筑工程学院研究生学位论文撰写规范（试行）》3.6"}
  - {text: "题目中文不超过 25 字，非特殊情况一般不设副标题；各章标题字数一般在 15 字以内，不得使用标点符号。", source: "《河北建筑工程学院研究生学位论文撰写规范（试行）》1.1、2.5.1"}
  - {text: "目录应包括全部章、节、条三级标题及其页号；一级标题顶格书写，二级标题缩进一格，三级标题缩进两格。", source: "《河北建筑工程学院研究生学位论文撰写规范（试行）》2.4"}
  - {text: "各层次题序及标题不得置于页面的最后一行（孤行）。", source: "《河北建筑工程学院研究生学位论文撰写规范（试行）》3.8"}
  - {text: "表题中不允许使用标点符号，表序与表名之间空一格，表名后不加标点；表注在表格底线后转行顶格书写，格式为“注：（具体内容）”，中文 6 号宋体、西文 7.5 磅 Times New Roman。", source: "《河北建筑工程学院研究生学位论文撰写规范（试行）》2.12"}
  - {text: "图名在图号之后空一格排写；有图注或其他说明时置于图题之上；插图之前文中必须有提示（如“见图1-1”）；插图与其图题不得拆开排写于两页。", source: "《河北建筑工程学院研究生学位论文撰写规范（试行）》2.13.2、2.13.3"}
  - {text: "公式原则上应居中书写，公式末不加标点；公式较长时在等号处转行。", source: "《河北建筑工程学院研究生学位论文撰写规范（试行）》2.11、3.9"}
  - {text: "艺术硕士正文各部分用“一、二、三”等序号，下一级为“（一）（二）（三）”，再下一级为“1.2.3.”，再下一级为“（1）（2）（3）”。", source: "《艺术硕士研究生专业学位论文写作规范》二、5；《河北建筑工程学院研究生学位论文撰写规范（试行）》3.8"}
  - {text: "注释采用脚注方式列于每一页下方；参考文献列于文末，中文按作者姓名拼音字母顺序，外文按西文字母次序排列。", source: "《艺术硕士研究生专业学位论文写作规范》二、7"}
  - {text: "论文标题正标题一般不超过 20 个字（可另加副标题）；文本核心部分字数不少于 0.5 万（不含谱例、图表）。", source: "《艺术硕士研究生专业学位论文写作规范》二、1，二、7"}
