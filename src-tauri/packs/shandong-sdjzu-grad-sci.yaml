checks:
  keywords:
    source: "《山东建筑大学研究生学位论文撰写指南（2026版）》二（四）中文摘要：列出 3～8 个关键词，关键词之间用分号相隔；三（三）中文关键词用全角分号分隔，三（四）外文关键词用半角分号分隔"
    min_count: 3
    max_count: 8
    zh_separator: "；"
    en_separator: ";"
  caption_numbering:
    source: "《山东建筑大学研究生学位论文撰写指南（2026版）》三（八）图应分章编号，如图 1.1；三（九）表应分章编号，如表 1.1"
  table_caption:
    source: "《山东建筑大学研究生学位论文撰写指南（2026版）》三（九）表的编号和表题应置于表上方"
  figure_caption:
    source: "《山东建筑大学研究生学位论文撰写指南（2026版）》三（八）图的编号和图题应置于图下方"
  continued_caption:
    source: "《山东建筑大学研究生学位论文撰写指南（2026版）》三（九）如某个表需要转页接排，在随后各页上应重复表的编号，如“续表 2.1 ××××”，且续表均应重复表头"
  equation_number:
    source: "《山东建筑大学研究生学位论文撰写指南（2026版）》三（十）论文公式应分章编号，并将编号置于括号内，如(1.1)，公式编号右端对齐"
  abstract_text:
    source: "《山东建筑大学研究生学位论文撰写指南（2026版）》二（五）外文摘要：并在其后列出与中文相对应的外文关键词"
    keywords_match: true
  chapter_number:
    source: "《山东建筑大学研究生学位论文撰写指南（2026版）》三（七）理学、工学、医学类学位论文的章节编排建议以阿拉伯数字编号，如 1，1.2，1.2.1 逐级递推"
  citations:
    source: "《山东建筑大学研究生学位论文撰写指南（2026版）》二（十）参考文献按文中使用的顺序列出；四、理工科参考文献著录应遵照 GB/T 7714—2025"

