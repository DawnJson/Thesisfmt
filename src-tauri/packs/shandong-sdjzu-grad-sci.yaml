    front_first: 1
    body_first: 1

manual:
  - {text: "表中若有附注，附注写在表的下方。", source: "《山东建筑大学研究生学位论文撰写指南（2026版）》三（九）"}
  - {text: "图宜有图题；如有英文标题，以 Fig. 1.1 编号；表如有英文标题，以 Tab. 1.1 编号；全文编号方式应统一。", source: "《山东建筑大学研究生学位论文撰写指南（2026版）》三（八）、三（九）"}
  - {text: "摘要标题后“关键词：”用黑体加粗小四号，英文“Key Words:”加粗四号；中文摘要第一自然段段前 0.5 行（本规则包不检查）。", source: "《山东建筑大学研究生学位论文撰写指南（2026版）》三（三）、三（四）"}
  - {text: "页眉文字为“山东建筑大学博（硕）士学位论文”，须按所攻读学位人工核对。", source: "《山东建筑大学研究生学位论文撰写指南（2026版）》三（十一）"}
  - {text: "页面设置：装订线位置左侧，装订线 0.5cm；论文用 A4 纸双面打印。", source: "《山东建筑大学研究生学位论文撰写指南（2026版）》五"}
  - {text: "论文封面采用研究生院统一印制的封面；封面中文论文题目小二号加粗宋体，外文题目小二号加粗，学生姓名等信息小四号加粗宋体。", source: "《山东建筑大学研究生学位论文撰写指南（2026版）》二（一）、三（二）"}
  - {text: "摘要字数：硕士学位论文中文摘要一般为 600～800 字，博士学位论文一般为 1200～1500 字。", source: "《山东建筑大学研究生学位论文撰写指南（2026版）》一"}
  - {text: "参考文献原则上不少于 50 篇，其中近 5 年不少于 60%，近 3 年不少于 30%，外文不少于五分之一。", source: "《山东建筑大学研究生学位论文撰写指南（2026版）》二（十）"}
  - {text: "附录内容宋体小四号，1.5 倍行距。", source: "《山东建筑大学研究生学位论文撰写指南（2026版）》三（十三）"}
  - {text: "图题与图序之间空一格，图名后不加标点；表序与表名之间空一格，表名后不加标点。", source: "《山东建筑大学研究生学位论文撰写指南（2026版）》三（八）、三（九）"}
  - {text: "引文内容可用楷体；拉丁文采用斜体，希腊文用 Symbol。", source: "《山东建筑大学研究生学位论文撰写指南（2026版）》三（六）"}
