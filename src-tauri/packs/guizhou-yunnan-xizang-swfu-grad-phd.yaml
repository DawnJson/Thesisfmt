manual:
  - {text: "页眉：中文摘要、英文摘要、目录、参考文献等部分用各部分内容的标题；从第一章开始奇数页页眉用“本章标题”，偶数页页眉用“西南林业大学博士学位论文”，页眉线为单横线。", source: "《西南林业大学研究生学位论文撰写规范》（2024-10）三、4 页眉（1）（2）（3）"}
  - {text: "中文摘要约 1500 字左右；关键词另起一行置于摘要页下方。", source: "《西南林业大学研究生学位论文撰写规范》（2024-10）一、4 中文摘要"}
  - {text: "论文题目控制在 25 字以内；标题不超过一行，标题中不加标点符号。", source: "《西南林业大学研究生学位论文撰写规范》（2024-10）一、1（1）；二、2"}
  - {text: "大标题段后 0.5 行；各级节标题段前 0.5 行、段后 0 行；两标题之间没有文字时第二个标题段前为 0；段后行距可适当调节，故这些不检查，请人工核对（大标题段前 0.5 行及附录等标题的段前段后已检查）。", source: "《西南林业大学研究生学位论文撰写规范》（2024-10）三、6（2）（3）"}
  - {text: "各层次的节序及标题不得置于页面的最后一行，只有一行或两行的文字不得作为一页的内容。", source: "《西南林业大学研究生学位论文撰写规范》（2024-10）二、2"}
  - {text: "引用文献标注可采用顺序编码制，也可采用著者-出版年制，但全文必须统一；顺序编码制编号用方括号内阿拉伯数字，置于所引内容最后一个字的右上角，不得置于各级标题处。", source: "《西南林业大学研究生学位论文撰写规范》（2024-10）二、3 引用文献标注"}
  - {text: "图之前、表之前正文中必须有相关提示（如“见图 1-1”“如表 1-1 所示”）；图题不能跨页，图与图题不得拆开排于两页，一般情况下表不能拆开两页编排。", source: "《西南林业大学研究生学位论文撰写规范》（2024-10）二、5 图（4）（5）、表（2）"}
  - {text: "表题中不允许出现标点符号；图名、表名在图序、表序之后空 1 个半角字符。", source: "《西南林业大学研究生学位论文撰写规范》（2024-10）二、5 图（1）、表（1）"}
  - {text: "公式应另起行并居中书写，序号右端对齐；公式较长时在等号处转行。", source: "《西南林业大学研究生学位论文撰写规范》（2024-10）二、5 公式"}
  - {text: "致谢不超过 300 字；不要在一篇参考文献中间换页。", source: "《西南林业大学研究生学位论文撰写规范》（2024-10）一、17 致谢；三、6（4）"}
