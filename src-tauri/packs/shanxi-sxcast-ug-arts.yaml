manual:
  - {text: "封面：“毕业设计”或“毕业论文”按题目类型自行修改；标题宋体三号、一般不超过25字；“本科生毕业论文/设计”宋体小初、加粗、居中、单倍行距；学院、专业班级、姓名、学号、指导教师宋体三号加粗，数字用 Times New Roman；学校名称与日期宋体四号；专业填写全称，共同指导的指导教师须全部署名。", source: "模板封面页批注"}
  - {text: "原创性声明、关于毕业论文使用授权的声明：标题黑体小二号、居中，行距固定值23.5磅，标题上下各空一行。", source: "模板声明页批注"}
  - {text: "页眉：首页不同、奇偶页不同，第一页不添加页眉；奇数页为“作者姓名：毕业设计（论文）题目”，偶数页为“山西应用科技学院****届本科生毕业论文”或“山西应用科技学院****届本科生毕业设计”，与封皮保持一致。", source: "模板页眉批注"}
  - {text: "正文首页大标题（论文题目）：上下各空一行，黑体、小二号、加粗、居中，行距固定值23.5磅，本页不添加页眉。", source: "模板批注"}
  - {text: "摘要内容一般300字左右；英文摘要关键词的首字母大写，“Keywords”加粗。", source: "模板摘要页批注"}
  - {text: "正文引用序号 [1] 宋体小四、上标，与参考文献序号一致。", source: "模板批注"}
  - {text: "图的插图与名称为一个整体，不能跨页；表格居中，宽度不得超页边距；表中参数应标明量和单位的符号。", source: "模板图表批注"}
  - {text: "参考文献：标点全部为英文状态；注意不要在一篇参考文献段落的中间换页。", source: "模板参考文献批注"}
  - {text: "致谢正文：宋体小四号、行距固定值23.5磅、首行缩进2个字符（独立一页）。", source: "模板致谢批注"}
