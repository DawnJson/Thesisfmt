checks:
  keywords:
    source: "模板《社会科学类》示例格式（批注未规定分隔符）"
    zh_separator: "；"
    en_separator: ";"
  caption_numbering:
    source: "模板批注：表序前部分数字表示表所在章的序号，后部分数字表示表在该章的序号，如“表2-1团购途径”；图的编号用阿拉伯数字"
  figure_caption:
    source: "模板批注：图的编号和名称应居中，位于图的下方，编号在前用阿拉伯数字，名称在后，末尾不加标点"
  table_cell:
    source: "模板批注：表格内文字：宋体五号，行距15磅，表头文字加粗，名称左对齐，其他居中"
    cn_font: 宋体
    size: 五号
    line: {rule: exact, value: 15}
  table_lines:
    source: "模板批注：表格线型：除表头表尾横线实线外，其它做空线；三线表外部线形1.5磅，内部线形1磅"
    top_bottom_pt: 1.5
    header_pt: 1.0

