  kind: journal
  category: 期刊
  verified: true

# 规范依据：编辑部《计算机工程投稿模板》（计算机工程投稿模板.doc）。模板开头明确写明：
# “投稿论文可以不按以下具体格式（分栏、字体、字号等），但必须包含以下论文中的相关要素和总体结构”，
# 所以本规则包不设页面、字体、字号、行距等版式检查，只检查模板用文字写明的要素要求。
checks:
  keywords:
    source: "模板“关键词”：“建议5个~8个，为论文中出现过的专业术语，关键词之间以分号“；”间隔”"
    min_count: 5
    max_count: 8
    zh_separator: "；"
    en_separator: ";"
  abstract_text:
    source: "模板“摘要”：“总400字以上为宜”“不宜在摘要中使用引文、公式、图表”；“Key words”：“英文关键词与中文关键词一一对应”"
    zh_min_chars: 400
    no_figures: true
    keywords_match: true
  figure_caption:
    source: "模板“对于论文中图形和表格的相关内容要求”图 4）：“图序号和图题置于图的下方”"
  citations:
    source: "模板引言：“所有参考文献全部顺序引用”；“参考文献”：“参考文献应按顺序在正文中逐条引用，从文献1开始”"

manual:
  - {text: "标题：中文标题为名词性短语，尽量 20 字以内；英文标题与中文含义一致、首字母大写。", source: "模板首页说明"}
  - {text: "作者信息：每个作者标注相应单位，用上标 * 标注通信作者（只能一位）；单位具体到二级部门，格式为“单位名，省份 城市 邮编”，英文单位邮编后加 China。", source: "模板首页说明"}
  - {text: "摘要用第三人称客观陈述，不用“本文”“我们”；包含问题或目的、技术过程和方法、结果和结论四个要素，最好有定量结果；缩略语首次出现须说明。英文摘要与中文对应，用第三人称主动语态一般现在时。", source: "模板“摘要”“Abstract”"}
  - {text: "英文关键词除专有名词、缩写词和特殊格式外一律小写。", source: "模板“Key words”"}
  - {text: "引言章节序号为 0；引言不能出现图、表及公式，不要与摘要、结束语重复；每个英文缩写首次出现时给出“中文全称（英文缩写）”。", source: "模板“0 引言”“正文保证每个英文缩写……”"}
  - {text: "引文序号用上标；一次连续引用不超过 3 条；用“文献[1-2]介绍了……”形式叙述时序号不用上标。", source: "模板引言末段"}
  - {text: "图、表分别用阿拉伯数字依序连续编号（图1、表1，不按章编号）；有分图时分图序号用（a）、（b）并增加分图标题；正文须明确指出“如图1所示”，不可写“见下图”；图中给出横纵坐标标题；图像类图分辨率 600 dpi 以上。", source: "模板图、表相关内容要求"}
  - {text: "表序号和表题置于表的上方（中英文双语题注，检查难以对应，故不设表题位置检查）；表格用三线表，必要时可加辅线；表中文字须为中文；同类数据有效数字位数一致，注意千分位空格；数据有单位的须给出。", source: "模板表的相关内容要求 1）2）"}
  - {text: "公式用 MathType 输入，不用图片，也不用 Word 自带公式编辑器；公式序号用（1）形式按顺序标号（不按章编号）；变量用单字母斜体，矩阵矢量用黑斜体，常数、特殊函数、运算符号、单位用正体。", source: "模板公式的相关内容要求"}
  - {text: "代码、伪代码不要以图和表的形式插入文中。", source: "模板“3.2 二级标题”"}
  - {text: "参考文献要求 25 条以上，建议有 3-4 篇中文文献；中文文献下方添加对应的英文翻译；著录格式按官网下载中心《参考文献著录规则》。", source: "模板“参考文献”"}
  - {text: "文章最后给出前 3 位作者的联系方式（手机、电话及 E-mail）。", source: "模板末段"}
