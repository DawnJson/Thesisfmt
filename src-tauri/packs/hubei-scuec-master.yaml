manual:
- text: 页眉从摘要开始：奇数页为“中南民族大学硕士学位论文”（标明培养类别和学位论文级别，如同等学力硕士学位论文），偶数页为学位论文题目；页眉下方添加上边线加粗、细双线的横线；页码数字两侧不加“－”等修饰线。
  source: 中南民族大学研究生院《硕士学位论文模板》（2025-06，批注中的格式说明）页面批注
- text: 全文每页 35 行，每行 35 字，页码在版心下边线之下隔行居中放置；全文采用 A4 纸。
  source: 中南民族大学研究生院《硕士学位论文模板》（2025-06，批注中的格式说明）页面批注
- text: 摘要字数（以汉字计）500 字左右，关键词上方空一行；英文摘要段落中的英文标点符号后面应有一个半角空格；英文摘要与英文题名页另起一页（英文题名页从奇数页起排）。
  source: 中南民族大学研究生院《硕士学位论文模板》（2025-06，批注中的格式说明）摘要批注
- text: 目录两字间空 2 格，目录项显示到 3 级，页码右对齐、有前导符，二级目录项左缩进 1 字符、三级左缩进 2 字符；正文修改后应刷新目录。
  source: 中南民族大学研究生院《硕士学位论文模板》（2025-06，批注中的格式说明）目录批注
- text: 标题字数一般在 15 字以内，不得使用标点符号；绪论作为第一章，序号和标题间空一格；硕士学位论文字数 2～5 万字，结论内容一般在 2000 字左右，参考文献不少于 20 篇。
  source: 中南民族大学研究生院《硕士学位论文模板》（2025-06，批注中的格式说明）正文批注
- text: 表格采用三线表形式；表序与表名之间空 1 个空格，表名及图名中不使用标点符号，名后不加标点；图片以嵌入式插入、居中，图题与图片必须在同一页；图注或图片来源说明、表注或数据来源说明为宋体、Times New Roman、五号，两端对齐（图注首行缩进 2 字符，表注首行缩进 1 字符）。
  source: 中南民族大学研究生院《硕士学位论文模板》（2025-06，批注中的格式说明）图表批注
- text: 公式内容居中书写，包含公式的段落可设置段前段后 6 磅、多倍行距 1.25；文中引用公式时一般用“见式（1.1）”或“由公式（1.1）”。
  source: 中南民族大学研究生院《硕士学位论文模板》（2025-06，批注中的格式说明）公式批注
- text: 引用参考文献的编号为 Times New Roman 小四号上标，不得置于各级标题处；文中直接说明时序号用小四号字与正文排齐。
  source: 中南民族大学研究生院《硕士学位论文模板》（2025-06，批注中的格式说明）引用批注
- text: 人文类模板：长段引文可用“块引文”格式（楷体五号，单倍行距，左右缩进 2 字符，段前段后 0 行，首行缩进 2 字符）。
  source: 中南民族大学研究生院《硕士学位论文模板》（2025-06，批注中的格式说明）人文类模板批注
