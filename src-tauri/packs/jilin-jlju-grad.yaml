manual:
- text: 页眉从摘要页开始至最后一页：偶数页为“吉林建筑大学硕士学位论文”（博士为“吉林建筑大学博士学位论文”），页眉横线为单实线；英文类论文偶数页为 Master's thesis of Jilin Jianzhu University / Doctoral Dissertation of Jilin Jianzhu University。
  source: 《撰写指南》三（十三）页眉
- text: 一级标题对齐：理工类左对齐、人文社科类与英文类居中；二级标题人文社科类居中；三级标题、四五级标题人文社科类另有格式。本规则包按理工类编制，对齐方式未检查，章节编号建议理工类用“1”“1.1”“1.1.1”，人文社科类用“第一章”“第一节”“一、”。
  source: 《撰写指南》三（九）章、节标题
- text: 章节标题序号和标题间空1个汉字符（两个半角空格）；章节标题应简明扼要，无标点符号；标题避免单独出现在页末。
  source: 《撰写指南》二（八）、三（九）
- text: 摘要标题、目录标题、致谢标题、附录标题的字间空两个全角空格或4个半角空格（如“摘  要”）。
  source: 《撰写指南》三（五）（七）（十五）（十六）
- text: 中文摘要建议300~1500汉字；论文题名一般不超过25字；学术硕士主体部分一般不少于3万字，专业学位硕士不少于2万字，博士正文一般不少于5万。
  source: 《撰写指南》一、总体要求；二（二）
- text: 图表编号：图片、表格较少时可全文依序编号（图1、表1），较多时分章依序（图1.1、表1.1），全文编号方式需统一；图题、表题中不允许使用标点符号，题后不加标点；编号与题名之间空2格。
  source: 《撰写指南》三（十）（十一）
- text: 英文图题 / 表题另起一行位于中文图题 / 表题之下（Figure 1.1 Figure Name / Table 1.1 Table Name），Times New Roman，五号，居中，固定值20磅；分图用(a)、(b)、(c)编序，列在各分图正下方。
  source: 《撰写指南》三（十）（十一）
- text: 图与上文间、图题（含图注或资料来源）与下文间各留一空行；表题与上文、表格（含表注）与下文各留一空行；图注或资料来源为宋体 / Times New Roman 小五号居中，固定值20磅。
  source: 《撰写指南》三（十）（十一）
- text: 表格宽度应与页面左右边距相同；列数超出页边距时改为横向页面；表格内容不能在同一页面显示时需做续表，续表表题可省略，但应再次出现表头内容。
  source: 《撰写指南》三（十一）
- text: 引用的参考文献用阿拉伯数字编号，前后加中括号，格式如[1]，Times New Roman 小四号，上标；参考文献编号和标题内容之间空1个半角空格；著录格式按 GB/T 7714-2025。
  source: 《撰写指南》三（十四）、四
- text: 正文中出现的图、表、公式需在正文中有描述（如图1.1、见表1.1、见式（1.1））；公式编号括号为全角括号，公式内容置于页面中部。
  source: 《撰写指南》三（八）（十二）
- text: 除封面外，所有英文字母、阿拉伯数字和半角标点符号默认用 Times New Roman 字体。
  source: 《撰写指南》三（八）
- text: 目录通常显示到三级，各级目录项左缩进依次为0、1、2字符；页码右对齐并有前导符，目录标题、条目及前导符须整体撑满版心。
  source: 《撰写指南》二（七）、三（七）
- text: 致谢落款：致谢人姓名为华文行楷小二号右对齐，落款日期及地点为宋体小四号右对齐。
  source: 《撰写指南》三（十五）
- text: 封面至原创性声明页装订线左1厘米，摘要至文末装订线为左0厘米；论文双面打印，封面、题名页、原创性声明和使用授权声明单面印刷。
  source: 《撰写指南》四、学位论文的打印与装订
- text: 正文中出现括号需使用全角括号（包括括号内为英文）；标点依据《标点符号用法》（GB/T 15834）。
  source: 《撰写指南》开头、三（八）
- text: 表题置于表上方、英文表题在中文表题之下（模板示例格式；规范只写“表题与上文留一空行，表格与下文应留一行空行”），因表题与表之间有英文表题，未启用 table_caption 检查。
  source: 模板《吉林建筑大学硕士论文模板》示例格式
