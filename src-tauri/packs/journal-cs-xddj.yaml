manual:
  - {text: "从正文内容开始设置为双栏排版，必要的图、表、公式可通栏（一栏）排。", source: "模板《论文模板.docx》投稿注意事项（2）"}
  - {text: "页眉页脚设置首页不同、奇偶页不同。", source: "模板《论文模板.docx》投稿注意事项（3）"}
  - {text: "全文字数一般不超过 6 000 字。", source: "模板《论文模板.docx》投稿注意事项（7）"}
  - {text: "表格采用三线表形式，可加必要辅助线；表中表头不能出现斜线；表头和表身用“量符号/单位”或“量名称/单位”格式。", source: "模板《论文模板.docx》投稿注意事项（5）、2.3 表格"}
  - {text: "图题格式为“图1 中文图题”，表题格式为“表1 中文表题”，所有图、表顺次编号；图、表随文给出（先文后图、先文后表）。", source: "模板《论文模板.docx》2.2.1、2.3"}
  - {text: "图中文字采用六号宋体，外文字母、数字及符号采用 Times New Roman；占半栏时图宽不超过 80 mm，通栏不超过 160 mm；输出分辨率 600 dpi 以上，不出彩图。", source: "模板《论文模板.docx》2.2.1、2.2.2"}
  - {text: "公式必须用 MathType 编辑器书写，公式字号 10 磅；全文公式用阿拉伯数字顺次编号，编号置于括号内并右端对齐，如“（1）”；公式符号首次出现时给出含义，格式“式中：a为……；b为……”。", source: "模板《论文模板.docx》2.1 公式"}
  - {text: "变量用斜体，计量单位、已知函数、运算符、数学常数、括号、英文缩写用正体，矢量和矩阵用黑斜体，数集用黑正体。", source: "模板《论文模板.docx》2.1 公式、投稿注意事项（6）"}
  - {text: "英文摘要不宜超过 250 个实词，内容应与中文摘要一致；英文标题三号 Times New Roman，作者、单位、英文摘要等用小五 Times New Roman。", source: "模板《论文模板.docx》英文标题、Abstract 部分"}
  - {text: "参考文献数量应在 20 个以上，且引用文献的出版时间不超过 5 年；主要责任者在 3 名以内的全部列出，超过 3 名时后面加“等”。", source: "模板《论文模板.docx》参考文献注（1）（3）"}
  - {text: "请用 Word 2010 以上版本撰稿，不要使用 WPS。", source: "模板《论文模板.docx》投稿注意事项（1）"}
