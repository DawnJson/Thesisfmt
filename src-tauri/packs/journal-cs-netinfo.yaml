  version: "2025"
  source: http://netinfo-security.org/EN/column/column6.shtml
  org: 《信息网络安全》
  kind: journal
  category: 期刊
  verified: true

# 规范依据：投稿指南页附件《〈信息网络安全〉文章写作要求》（20250227141541.doc），
# 文件内各节用文字写明了格式要求，下文 source 引用其章节标题。
roles:
  chapter:
    source: "《文章写作要求》“六 模版”：“1 一级标题（顶格）”"
    first_line_chars: 0
  section_1:
    source: "《文章写作要求》“六 模版”：“1.1 二级标题（顶格）”"
    first_line_chars: 0
  section_2:
    source: "《文章写作要求》“六 模版”：“1.1.1 三级标题（顶格）”"
    first_line_chars: 0
  body:
    source: "《文章写作要求》“五 正文”：“正文行距使用单倍行距”"
    line: {rule: auto, value: 1.0}
  keywords_en:
    source: "《文章写作要求》“六 模版”：“以下紧接英文题目、作者姓名及所在单位的英译文、摘要和关键词的英译文，字体使用Times New Roman”"
    latin_font: Times New Roman
  fig_caption:
    source: "《文章写作要求》“图形”：“图号和图名用小五号宋体，图下居中”"
    cn_font: 宋体
    size: 小五
    align: center
  table_caption:
    source: "《文章写作要求》“表格”：“表序和表题应写在表格上方正中”"
    align: center

checks:
  keywords:
    source: "《文章写作要求》“三 摘要和关键词”：“关键词3—5个”；“六 模版”：“关键词各词条间用分号隔开，置于摘要下方”，英文示例“computer application; graphics recognition”"
    min_count: 3
    max_count: 5
    zh_separator: "；"
    en_separator: ";"
  table_caption:
    source: "《文章写作要求》“表格”：“表序和表题应写在表格上方正中”"
  figure_caption:
    source: "《文章写作要求》“图形”：“图号和图题应放在图位下方居中处”"
  citations:
    source: "《文章写作要求》“参考文献”“注意事项”2：“并按照先后顺序在正文中标注”“首次出现要按照从小到大的顺序在正文中标注，不可漏、跳”"
  punctuation:
    source: "《文章写作要求》“字体要求”：“全文的标点符号除了参考文献使用的实心圆点“.”之外，其余各处所用的标点符号应与所用的语种一致”"

manual:
  - {text: "标题 25 字以内，中英文标题内容对应，英文标题实词首字母大写；作者不超过 5 人，单位信息含学校院系或单位全称、省市、邮编，中英文对应。", source: "《文章写作要求》“一 标题”“二 作者”"}
  - {text: "摘要用第三人称，包含研究目的、实验方法、技术成果和最终结论，字数 300 字左右；英文摘要与中文对应，用过去时叙述工作和方法、现在时叙述结论，不能用将来时。", source: "《文章写作要求》“三 摘要和关键词”"}
  - {text: "文章必须有国家级或省部级基金项目支持，提供基金项目名称与编号并附基金证明；正文字数不少于 8000 字（综述类除外）；全文通篇使用一栏布局。", source: "《文章写作要求》“四 基金项目”“五 正文”"}
  - {text: "引言章节序号为 0；一、二、三级标题顶格，参考文献出处及注释序号不可标注在文中题目、摘要及各级标题上。", source: "《文章写作要求》“六 模版”"}
  - {text: "参考文献不少于 15 条（综述类建议不少于 50 条）；引用中文文献须提供对应英文文献且英文在前、中文在后；按文中给出的各类型著录格式编写，各文献发表时间应早于投稿时间。", source: "《文章写作要求》“参考文献”“注意事项”"}
  - {text: "图、表均在全文中统一连续编序（图1、表1，不按章编号）；表序写在表题左方不加标点，表序后空一格书写表题，表题末尾不加标点；图形用 Visio 绘制，图中中文用宋体、西文用 Times New Roman，无填充、线条黑色；插图紧接在文中第 1 次引用处之后。", source: "《文章写作要求》“表格”“图形”"}
  - {text: "公式简单的用纯文本，复杂的用 MathType 编写；公式居中，编号用圆括号放在公式右边行末，全文统一编序号且连续；矩阵、矢量、张量用加粗斜体；定理、定义、引理加粗。", source: "《文章写作要求》“公式”“字体要求”“定理、定义”"}
  - {text: "伪代码、算法以正文文本形式出现，不得做成图片；文章必须用 Word 编写，不可用 WPS 编写后转 Word。", source: "《文章写作要求》“代码”“注意事项”"}
