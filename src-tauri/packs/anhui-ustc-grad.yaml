checks:
  keywords:
    source: "§2.5 每篇论文应选取3～8个关键词，每个关键词之间用分号间隔；英文关键词之间用半角逗号加空一格间隔"
    min_count: 3
    max_count: 8
    zh_separator: "；"
    en_separator: ","
  abstract_text:
    source: "§2.5 英文摘要使用英文标点符号"
    en_punctuation: true
  caption_numbering:
    source: "§3.5 图、表和表达式按章连续编号，前一数字为章的序号，后一数字为本章内顺序号，两数字间用半角小数点“.”连接，如“图2.1”“表5.6”“式（1.2）”"
  punctuation:
    source: "§3.3 论文写作时标点符号应符合 GB/T 15834-2011 标点符号用法"
  table_caption:
    source: "§3.5.2 表题置于表的上方"
  figure_caption:
    source: "§3.5.1 图题置于图的下方"
  table_cell:
    source: "§3.5.2 表格文字中文采用宋体，英文和阿拉伯数字采用 Times New Roman 体，字号11pt；表单元格中的文字，单倍行距，段前3磅，段后3磅"
    cn_font: 宋体
    latin_font: Times New Roman
    size: 11pt
    line: {rule: auto, value: 1.0}
    before: 3
    after: 3
  continued_caption:
    source: "§3.5.2 以“续表”的形式另页打印，只需在另页的的表序前加“续”字，例如“续表2.1 实验方式”；续表均应重复给出横表头"
  equation_number:
    source: "§3.5.3 表达式的序号用括号括起置于表达式右边行末；§2.11 附录中表达式冠以附录序号，如“式（C.3）”"
  equation_layout:
    source: "§3.5.3 另起一段居中书写，或另起一段空两个汉字符书写，一旦采用了上述两种格式中的一种，全文都要使用同一种格式"
  chapter_number:
    source: "§3.4 章序号采用阿拉伯数字，如“第1章 引言”"
  appendix_number:
    source: "§2.11 附录依顺序用大写字母编序号，如附录A、附录B；只有一个附录时也要编序号，即附录A；附录中的图、表、表达式冠以附录序号，如“图A.1”“表B.2”“式（C.3）”"
  figure_citation:
    source: "§3.5 各图、表不要出现在文中首次提及之前，又不要距之过远"

layout:
  table_span:
    source: "§3.5.2 当表格较大而不能在一页内打印时，可以“续表”的形式另页打印，只需在另页的表序前加“续”字；续表均应重复给出横表头"
  toc:
    source: "§2.6 目录页由论文的章、节、附录等序号、名称和页码组成；§2.7 清单宜在文档编辑软件中自动生成"
  new_page:
    source: "§2.9 正文部分应从另页右页开始，每一章应另起页；§3.4 每章应另起一面"
    roles: [chapter]
  first_chapter_odd_page:
    source: "§2.9 正文部分应从另页右页开始"
  page_start:
    source: "§3.8 从“摘要”开始至“第1章”前结束，页码用罗马数字“Ⅰ、Ⅱ、Ⅲ……”表示；从“第1章”开始至论文结束，页码用阿拉伯数字“1、2、3……”表示"
    front_first: 1
    body_first: 1

manual:
  - {text: "摘要篇幅：博士论文中文摘要一般800～1000个汉字，硕士论文中文摘要一般600个汉字；英文摘要的篇幅参照中文摘要；中英文关键词须相互呼应。", source: "§2.5 摘要和关键词"}
  - {text: "摘要中不宜使用公式、图表、化学结构式、非公知公用的符号和术语，不引用文献。", source: "§2.5 摘要和关键词"}
  - {text: "各章标题字数一般应15字以内，用短语而非句子，末尾不加标点；一般不建议使用三级节标题，不得使用三级以下节标题。", source: "§3.4 章、节标题"}
  - {text: "参考文献采用“顺序编码制”或“著者-出版年制”之一，全文不得混用；所有标点符号使用半角符号，著录格式参见 GB/T 7714-2025。", source: "§2.10 参考文献"}
  - {text: "插图不允许跨页；插图前后与文字段落之间须留有10磅空行，与其它插图或表格连续排版时留20磅空行；表格同理。", source: "§3.5.1 插图 / §3.5.2 表格"}
  - {text: "图题、表题末尾不可加标点；图序与图名之间、表序与表名之间空一个汉字符。", source: "§3.5.1 插图 / §3.5.2 表格"}
  - {text: "注释采用文中编号加脚注方式，置于所注释正文所在页的底部，标注符合 CY/T 121；脚注格式模板未作规定。", source: "§3.7 注释"}
  - {text: "封面、原创性与使用授权声明、人工智能工具声明使用学校统一模板；封面和原创声明不编页码。", source: "§2.1、§2.3、§2.4、§3.8"}
  - {text: "致谢字数不超过1000个汉字，格式要求与正文同。", source: "§2.12 致谢"}
  - {text: "硕士学位论文正文一般不少于3万字，博士学位论文正文一般不少于5万字。", source: "§3.1 论文的基本要求"}
