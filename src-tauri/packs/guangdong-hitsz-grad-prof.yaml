  toc:
    source: 《指南》§1.3 目录是论文中各章节的顺序排列表，包括全部章、节、条三级标题及其页码
manual:
- text: 页码在版心下边线之下居中排放（模板用居中的浮动文本框放页码，程序读不到对齐方式，需人工确认）。
  source: 《指南》§2.2
- text: 正文建议段前、段后 0 行（模板中图题、续表题注等非正文段落段前后为 0.5 行，会被当作正文，故不检查）。
  source: 《指南》§3.2
- text: 各章节标题字数一般在 15 字以内，标题中不加标点符号，尽量不采用英文缩写词。
  source: 《指南》§2.5.1
- text: 摘要中不宜使用公式、化学结构式、图表、非常用的缩写词和非公知公用的符号与术语，不标注引用文献编号；摘要页不需写出论文题目。
  source: 《指南》§1.2.1、§2.3
- text: 表格不加左、右边线；表序与表名之间空 2 个半角字符，表名中不使用标点符号，表名后不加标点；数字空缺的格内加横线“—”。
  source: 《指南》§2.12
- text: 表需转页接排时以续表形式接排：表右上角注明编号，编号后加“（续表）”，并重复表头；一般情况下插表不能拆开两页编排。
  source: 《指南》§2.12；模板“表3-2（续表）”示例
- text: 图题与图序之间空 2 个半角字符，图题不宜有标点符号；分图号用（a）、（b）表示；分图过多需转页时，下页标“图序（续图）”字样。
  source: 《指南》§2.13.1、§2.13.2
- text: 公式另起行并居中书写，公式末不加标点；引用公式时一般用“见式（1-1）”或“由公式（1-1）”。
  source: 《指南》§2.11
- text: 正文中引用文献的标示置于所引内容最后一个字的右上角，编号为方括号内的阿拉伯数字，小 4 号字上角标；不得将引用文献标示置于各级标题处。
  source: 《指南》§2.6
- text: 硕士学位论文的参考文献一般不少于 40 篇，其中外文文献一般不少于总数的 1/2，近五年的文献数一般不少于总数的 1/3，并应有近两年的参考文献；本人在攻读学位期间发表的学术论文不应列入参考文献中。
  source: 《指南》§1.5
- text: 物理量符号、变量符号用斜体，计量单位符号用正体；外文字母与数字用 Times New Roman；采用英语缩写词时，除通用缩写词外，第一次出现应用括号注明英文原词。
  source: 《指南》§2.7、§2.9、§2.10
- text: 目录应包括摘要、Abstract、正文章节题目（编到第 3 级标题）、结论、参考文献、附录、攻读学位期间取得创新性成果、原创性声明、致谢等。
  source: 《指南》§2.4
