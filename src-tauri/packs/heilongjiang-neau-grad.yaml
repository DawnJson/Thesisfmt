checks:
  keywords:
    source: "模板《东北农业大学学术学位硕士学位论文模板》示例格式（规范未作文字规定）：中文关键词用“；”分隔，英文关键词用“;”分隔"
    zh_separator: "；"
    en_separator: ";"
  caption_numbering:
    source: "模板《东北农业大学学术学位硕士学位论文模板》示例格式（规范未作文字规定）：图表按章编号，如图1-1、表1-1"
  table_caption:
    source: "模板《东北农业大学学术学位硕士学位论文模板》示例格式（规范未作文字规定）：表序与表题（中、英文）置于表的上方"
  figure_caption:
    source: "模板《东北农业大学学术学位硕士学位论文模板》示例格式（规范未作文字规定）：图序与图题（中、英文）置于图的下方"
  table_lines:
    source: "模板《东北农业大学学术学位硕士学位论文模板》三线表示例格式（规范未作文字规定）：上下线1.5磅，表头线0.75磅"
    top_bottom_pt: 1.5
    header_pt: 0.75
  table_cell:
    source: "模板《东北农业大学学术学位硕士学位论文模板》表内文字示例格式（规范未作文字规定）：小五，居中（上下居中），单倍行距"
    cn_font: 宋体
    latin_font: Times New Roman
    size: 小五
    align: center
    line: {rule: auto, value: 1.0}
  continued_caption:
    source: "模板《东北农业大学学术学位硕士学位论文模板》示例格式（规范未作文字规定）：转页续排的表题注为“续表1-2 表题 / Tab. 1-2 Table Name (Continued)”"
  chapter_number:
    source: "模板《东北农业大学学术学位硕士学位论文模板》示例格式（规范未作文字规定）：章序号用阿拉伯数字，如“1 引言”“5 结论”"
  appendix_number:
    source: "模板《东北农业大学学术学位硕士学位论文模板》示例格式（规范未作文字规定）：附录用大写字母编号，如“附录A 标题”，附录内图表为图A1、表A1"
  footnotes:
    source: "模板《东北农业大学学术学位硕士学位论文模板》脚注示例格式（规范未作文字规定）：脚注序号为①②③，每页重新编号"
    circled: true
    restart_each_page: true

manual:
  - {text: "封面、原创性声明、学位论文版权使用授权说明、学位答辩委员会名单、中英文摘要、中英文目录依模板顺序排列；英文摘要页含 Title、Abstract、Keywords 及 Candidate / Speciality / Supervisor 信息。", source: "模板《东北农业大学学术学位硕士学位论文模板》结构示例（规范未作文字规定）"}
  - {text: "页眉奇偶页不同（模板设置了奇数页、偶数页两种页眉），具体内容以模板页眉为准。", source: "模板《东北农业大学学术学位硕士学位论文模板》页眉设置示例（规范未作文字规定）"}
  - {text: "每个图、表均有中英文题注（先中文、后英文，如“表1-1 表题”“Tab. 1-1 Table Name”）；表下注、资料来源可省略。", source: "模板《东北农业大学学术学位硕士学位论文模板》图表示例（规范未作文字规定）"}
  - {text: "公式序号用括号，按章编号，如（1-1）。", source: "模板《东北农业大学学术学位硕士学位论文模板》公式示例（规范未作文字规定）"}
  - {text: "参考文献按 GB/T 7714 著录，顺序编码，条目前加方括号序号，文献类型标识含载体标识（如 [M/OL]、[J/OL]）。", source: "模板《东北农业大学学术学位硕士学位论文模板》参考文献示例（规范未作文字规定）"}
