# 学校公布《东北农业大学研究生学位论文撰写规范（2026版）》时只提供 6 个 docx 模板，页面没有可读的规范文字，
# 因此下列规则均取自官方模板的示例格式（学术/专业、硕士/博士 4 份模板格式一致）。

page:
  source: "模板《东北农业大学学术学位硕士学位论文模板》正文节页面设置示例格式（规范未作文字规定）：A4，上3cm、下2.5cm、左3cm、右2.5cm，页眉页脚距2.5cm"
  paper: A4
  margins_cm: {top: 3.0, bottom: 2.5, left: 3.0, right: 2.5}
  header_distance_cm: 2.5
  footer_distance_cm: 2.5

page_numbers:
  source: "模板《东北农业大学学术学位硕士学位论文模板》示例格式（规范未作文字规定）：摘要、目录用大写罗马数字（目录中摘要页码为 I），正文用阿拉伯数字（正文第 1 页为 1）"
  front_format: upperRoman
  body_format: decimal

roles:
  chapter:
    source: "模板《东北农业大学学术学位硕士学位论文模板》“1 引言”等章标题示例格式（规范未作文字规定）：黑体小二"
    cn_font: 黑体
    size: 小二
    align: left
  section_1:
    source: "模板《东北农业大学学术学位硕士学位论文模板》“1.1 标题”示例格式（规范未作文字规定）：黑体小三"
    cn_font: 黑体
    size: 小三
    align: left
  section_2:
    source: "模板《东北农业大学学术学位硕士学位论文模板》“1.1.1 标题”示例格式（规范未作文字规定）：黑体四号"
    cn_font: 黑体
    size: 四号
    align: left
  body:
    source: "模板《东北农业大学学术学位硕士学位论文模板》正文示例格式（规范未作文字规定）：宋体 / Times New Roman，小四，两端对齐，首行缩进2字符，段前段后0"
    cn_font: 宋体
    latin_font: Times New Roman
    size: 小四
    align: justify
    first_line_chars: 2
    before: 0
    after: 0
  abstract_title_zh:
    source: "模板《东北农业大学学术学位硕士学位论文模板》“摘 要”标题示例格式（规范未作文字规定）：黑体小二，居中"
    cn_font: 黑体
    size: 小二
    align: center
  abstract_body:
    source: "模板《东北农业大学学术学位硕士学位论文模板》摘要正文示例格式（规范未作文字规定）：宋体 / Times New Roman，小四，两端对齐，首行缩进2字符"
    cn_font: 宋体
    latin_font: Times New Roman
    size: 小四
    align: justify
    first_line_chars: 2
    before: 0
    after: 0
  toc_title:
    source: "模板《东北农业大学学术学位硕士学位论文模板》“目 录”标题示例格式（规范未作文字规定）：黑体二号，居中"
    cn_font: 黑体
    size: 二号
    align: center
  references_title:
    source: "模板《东北农业大学学术学位硕士学位论文模板》“参考文献”标题示例格式（规范未作文字规定）：黑体小二，居中"
    cn_font: 黑体
    size: 小二
    align: center
  ref_item:
    source: "模板《东北农业大学学术学位硕士学位论文模板》参考文献条目示例格式（规范未作文字规定）：宋体 / Times New Roman，五号，两端对齐"
    cn_font: 宋体
    latin_font: Times New Roman
    size: 五号
    align: justify
  ack_title:
    source: "模板《东北农业大学学术学位硕士学位论文模板》“致 谢”标题示例格式（规范未作文字规定）：黑体小二，居中"
    cn_font: 黑体
    size: 小二
    align: center
  appendix_title:
    source: "模板《东北农业大学学术学位硕士学位论文模板》“附录A 标题”示例格式（规范未作文字规定）：黑体小二，居中"
    cn_font: 黑体
    size: 小二
    align: center
  fig_caption:
    source: "模板《东北农业大学学术学位硕士学位论文模板》图题示例格式（规范未作文字规定）：宋体 / Times New Roman，五号，居中，位于图下方"
    cn_font: 宋体
    latin_font: Times New Roman
    size: 五号
    align: center
  table_caption:
    source: "模板《东北农业大学学术学位硕士学位论文模板》表题示例格式（规范未作文字规定）：宋体 / Times New Roman，五号，居中，位于表上方"
    cn_font: 宋体
