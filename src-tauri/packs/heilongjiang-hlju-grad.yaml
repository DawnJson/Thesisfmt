manual:
- text: 奇偶页页眉不同：奇数页页眉为当前本章的题序及标题（如“第1章 绪论”），偶数页为“黑龙江大学硕（博）士学位论文”，单倍行距；版芯上边线隔一行加粗、细双线（上细下粗，粗线宽 0.8mm）。
  source: 《黑龙江大学研究生学位论文撰写规范（理科试用本）》（2026年3月）3.4
- text: 关键词一般列 3～5 个，按词条外延层次从大到小排列，隔行顶格排在摘要左下方；中文关键词排在中文摘要页，外文关键词排在外文摘要页。规范未规定关键词分隔符，故不启用关键词检查。
  source: 《黑龙江大学研究生学位论文撰写规范（理科试用本）》（2026年3月）1.2.2、3.5
- text: 中文摘要硕士不宜超过 300 字、博士不宜超过 500 字；摘要不宜使用公式、图表，不标注引用文献编号；中文摘要页不需写出论文题目；英文摘要与中文摘要内容应完全一致。
  source: 《黑龙江大学研究生学位论文撰写规范（理科试用本）》（2026年3月）1.2.1、2.3、3.5
- text: 硕士论文参考文献按正文中出现的先后顺序列表，引用标示置于所引内容最后一个字的右上角、方括号内阿拉伯数字、小 4 号上角标，不得置于各级标题处；参考文献序号左顶格用方括号标注。博士论文注释使用页下注，以页为单位连续编号，编号用数字加圈标注。
  source: 《黑龙江大学研究生学位论文撰写规范（理科试用本）》（2026年3月）1.4
- text: 硕士参考文献一般不少于 60 篇（外文不少于 30 篇），博士不少于 100 篇（外文不少于 1/2），近五年文献一般不少于总数的 1/3。
  source: 《黑龙江大学研究生学位论文撰写规范（理科试用本）》（2026年3月）1.4
- text: 目录应包括全部章、节、条三级标题及页号，一级标题顶格、二级缩进一格、三级缩进两格。
  source: 《黑龙江大学研究生学位论文撰写规范（理科试用本）》（2026年3月）2.4
- text: 论文版芯一般为 150mm×215mm（含页眉页码则为 150mm×235mm）；博士论文摘要、目录等的英文部分另起一页；各层次题序及标题不得置于页面的最后一行。
  source: 《黑龙江大学研究生学位论文撰写规范（理科试用本）》（2026年3月）2.2、3.7、论文的纸张、印刷与装订
