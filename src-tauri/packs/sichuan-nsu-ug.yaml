checks:
  keywords:
    source: "撰写规范二（一）2：关键词一般为3-6个；三（二）1、2：中文词间用“，”相隔，英文词间用半角“,”相隔，最后一个关键词后无标点"
    min_count: 3
    max_count: 6
    zh_separator: "，"
    en_separator: ","
  abstract_text:
    source: "撰写规范二（一）2：摘要中不宜使用公式、图表，不标注引用文献编号"
    no_figures: true
  caption_numbering:
    source: "撰写规范三（三）3：图号、表号编码用章序号，如“图4.1”表示第4章第1图，“表5.1”是第5章中的第1表"
  table_caption:
    source: "撰写规范二（二）2：图序及图名置于图的下方，表序及表名置于表的上方"
  figure_caption:
    source: "撰写规范二（二）2、三（三）3：图序及图名置于图的下方，图号、图题置于图的正下方"
  table_cell:
    source: "撰写规范三（三）3 表：表中文字用五号宋体，须全文统一"
    cn_font: 宋体
    size: 五号
  equation_number:
    source: "撰写规范三（三）3 公式：按章序号用阿拉伯数字编号，如式（3-1）表示第3章第1式，式号与公式同行居公式右侧排版"
  chapter_number:
    source: "撰写规范三（三）1：章、节、条、项用阿拉伯数字编号，章举例“第1章 XXX”"
  citations:
    source: "撰写规范二（三）1：正文引用处右上角加[1][2]…注号，注号全文统一排序并与参考文献页序号一致；参考文献按引用文献的顺序统一编号"

layout:
  toc:
    source: "撰写规范二（一）3：目录由设计报告（论文）的章、节、条、致谢、参考文献、附录等的序号、名称和页码组成，须注明各级标题的起始页码"
  new_page:
    source: "撰写规范二（一）3：目录应独立成页；三（三）1：每章应另起一页"
    roles: [chapter, toc_title]

manual:
  - {text: "题目不宜超过35个汉字；每章标题不宜超过25个汉字。", source: "撰写规范二（一）1、三（三）1"}
  - {text: "第四级条目以下：首行缩进2字符，段前段后1行，1.5倍行距，可使用不同编号。", source: "撰写规范三（三）1 标题表"}
  - {text: "各层次题序及标题不得置于页面的最后一行（孤行）；编号与题目之间空一格。", source: "撰写规范三（三）1"}
  - {text: "中文摘要标题“摘要”二字间间隔2空格；“目录”二字间间隔2空格。", source: "撰写规范三（二）1、3"}
  - {text: "“关键词”三字、“Key Words”采用黑体小四号加粗，位于摘要内容后下空一行。", source: "撰写规范三（二）1、2"}
  - {text: "目录：三级标题目录左缩进2个字符；标题与页码用“·······”相连，转行的标题文字缩进1字。", source: "撰写规范三（二）3"}
  - {text: "正文页眉使用单线，页眉内容为“成都东软学院毕业设计报告（或成都东软学院毕业论文）”。", source: "撰写规范三（三）2"}
  - {text: "正文页码从正文开始重新编排，至文章结尾连续编页。", source: "撰写规范三（三）2"}
  - {text: "图与图题、表与表题应在同一页；图中标注文字字号、表中内容和项目字号不大于图题、表题字号。", source: "撰写规范三（三）3"}
  - {text: "附录内图表、公式冠以附录序码，如图A.1、式（B.2）、表C.3。", source: "撰写规范三（四）3"}
  - {text: "代码：第1行段前0.5行，行首缩进2个汉字，其后各行段前段后各0行，多倍行距1.25，Times New Roman 五号，中文宋体五号，不加粗。", source: "撰写规范三（三）3 代码"}
  - {text: "参考文献：序号用方括号阿拉伯数字、左顶格，序号后一个半角空格；条目末尾以半角实心点结束；作者写到第三位，余者写“等”。", source: "撰写规范三（四）1"}
  - {text: "正文字数应不少于0.8万字；中文摘要一般为400字左右。", source: "撰写规范二（一）2、二（二）2"}
  - {text: "原创承诺书不加页脚。", source: "撰写规范三（四）4"}
