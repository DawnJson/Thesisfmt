# 依据：《内蒙古农业大学本科生毕业设计（论文）撰写规范（2025年12月修订）》（附件1-1，下称「规范」）。
# 规范二（六）指定“编写样本及详细要求见附件1-3.本科生毕业设计（论文）原文样式”，样本内没有文字说明，
# 故样本示例格式视为学校规定；下面标注“样本”的规则取自附件1-3，只保留样本中多段一致的项目。
page:
  source: "规范二（三）：A4 纸；其他页边距左 3 厘米、右 2.5 厘米、上 3 厘米、下 2.5 厘米，页眉边距 2.4 厘米，页脚边距 1.75 厘米"
  paper: A4
  margins_cm: {top: 3.0, bottom: 2.5, left: 3.0, right: 2.5}
  cover_margins_cm:
    - {name: 封面, source: "规范二（三）：封面页边距左 0 厘米、右 0.05 厘米、上 2.54 厘米、下 0.4 厘米", top: 2.54, bottom: 0.4, left: 0.0, right: 0.05}
  header_distance_cm: 2.4
  footer_distance_cm: 1.75

