manual:
  - {text: "每页 35 行，每行 36 字，每页 1260 字；A4 纸双面印刷，整篇论文左侧装订，单页左侧为订边，双页右侧为订边。", source: "规范二（三）、（四）"}
  - {text: "毕业设计（论文）正文字数：外语类专业不低于 5000 词，其他专业不低于 8000 字。", source: "规范二（五）"}
  - {text: "原文材料顺序：封面、诚信承诺书、中文摘要与关键词、英文摘要与关键词、目录、正文、致谢、参考文献、附录、支撑材料；毕业设计须明确计算说明书、工程图纸。", source: "规范一（一）2、二（二）"}
  - {text: "各学院可根据专业特点制定相应毕业设计（论文）撰写规范，学院有规定的以学院规定为准；诚信承诺书需手签或电子手写签名。", source: "规范前言、一（二）3"}
  - {text: "图表编号：样本图、表采用全文连续编号（图1、表1），不按章编号。", source: "样本《附件1-3 原文样式》"}
