manual:
- text: 页眉为“哈尔滨工业大学本科毕业设计（论文）”，在版芯上边线加粗、细双线（粗线在上，宽 0.8mm），双线上居中打印，小 5 号宋体；封面及内封不加页眉。
  source: §3.4 页眉
- text: 中文摘要字数一般为 300 字左右；英文摘要与中文摘要内容应完全一致；摘要页不需写出论文题目。
  source: §2.3 摘要
- text: 目录应包括章、节、条三级标题及其页码（理工类要求编到第 3 级标题）。
  source: §1.3、§2.4 目录
- text: 论文主体各章后应有一节“本章小结”（实验方法或材料等章节可不写）；论文题目不应超过 25 字，不得使用标点符号，不设副标题；各章标题字数一般在 15 字以内。
  source: §1.4.2、§1.1、§2.5.1
- text: 表格不加左、右边线；转页接排的表以续表形式接排，表右上角注明编号，编号后加“（续表）”，并重复表头。
  source: §2.12 插表
- text: 公式原则上另行起并居中书写，公式末不加标点。
  source: §2.11 公式
- text: 附录序号采用“附录1”、“附录2”等，外文文献的中文译文作为附录1，外文复印件作为附录2。
  source: §2.15 附录
- text: 论文一律单面复印或胶印，封面使用教务处统一印制的封面；书脊标注作者姓名、题目及“本科毕业设计（论文）”字样，用小 4 号黑体。
  source: §3.3、§3.8、§2.16
- text: 参考文献理工类一般 10～15 篇（学术期刊类不少于 7 篇，外文文献不少于 3 篇），文科、管理类一般 15～20 篇；近五年文献一般不少于总数的 1/3。
  source: §1.5 参考文献
