manual:
- text: 关键词一般选用三到五个；“关键词”三字用黑体小四；冒号与中文关键词之间不空格，关键词之间加二个空格（不用标点）；一行写不下时第二行第一个字与第一行冒号后的字对齐。
  source: 范文注（关键词）
- text: 英文关键词：每个关键词头字母大写、其余小写，“Key words”加粗，冒号与第一个关键词之间空一个空格，关键词之间空二个空格；摘要标题“Abstract”仅头字母大写。
  source: 范文注（Key words）
- text: 摘要一般 500 字以内，外文摘要以不超过 300 个单词为宜；英文翻译要与中文对应一致，尽量不用英文缩写词；摘要不标注引用文献。
  source: 范文摘要说明
- text: “摘  要”“目  录”“绪  论”“结  论”“致  谢”二字之间空二格；标题“第x章”与后面文字空二个空格。
  source: 范文注
- text: 目录中一级标题顶格，二级标题空两个字符，三级标题空四个字符。
  source: 范文注（目录）
- text: 图、表与上下文之间的空行：图序及图名与下面文字之间空一行，表序及表名与上面文字之间空一行，但紧邻标题时不空行；此空行段落设为段前、段后 0 行，固定值 20 磅。图与上文、图形与图序、表或图与页眉、表格底线与下文靠得很近时，加一空行设为段前、段后 0 行，固定值 10 磅。
  source: 范文注（图或表 (2)(3) 及特殊情况 (1)–(4)）
- text: 参考文献序号后的文字一行写不下时，第二行第一个字与上一行序号后的字对齐；英文标点一律用英文状态下的标点；著录参见 GB7714-87。
  source: 范文注（参考文献）
