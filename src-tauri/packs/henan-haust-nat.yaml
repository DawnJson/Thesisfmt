  version: "2014-10"
  source: https://cl.haust.edu.cn/info/1268/14389.htm
  org: 河南科技大学
  kind: university
  category: 研究生
  verified: true

page:
  source: "《河南科技大学研究生学位论文撰写规范（自然科学类）》第 2 条页面设置：上3cm，下2.5cm，左、右均为3cm；A4；页眉2.3cm、页脚1.8cm"
  paper: A4
  margins_cm: {top: 3.0, bottom: 2.5, left: 3.0, right: 3.0}
  header_distance_cm: 2.3
  footer_distance_cm: 1.8

page_numbers:
  source: "规范第 15 条页脚：摘要至目录用大写罗马数字（Ⅰ，Ⅱ，Ⅲ……）单独编排，论文正文至最后用阿拉伯数字（1，2，3……）单独编排；Times New Roman 体，小五号，外侧"
  front_format: upperRoman
  body_format: decimal
  footer_latin_font: Times New Roman
  footer_size: 小五
  restart_at: 1

headers:
