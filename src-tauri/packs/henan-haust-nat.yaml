checks:
  keywords:
    source: "规范第 6 条关键词：一般3～8个，之间用分号分开"
    min_count: 3
    max_count: 8
    zh_separator: "；"
    en_separator: ";"
  caption_numbering:
    source: "规范第 9.2.1 条：所有图须按章编号，如“图1-1”；第 9.2.2 条：表序一律采用阿拉伯数字分章编号，如“表3-1”"
  punctuation:
    source: "规范第 3 条标点符号：标点符号的用法应该以 GB/T 15834-2011《标点符号用法》为准"
  table_caption:
    source: "规范第 9.2.2 条：表序和表题……必须置于表格上方居中排列"
  figure_caption:
    source: "规范第 9.2.1 条：图序与图题……在图的下方居中标出"
  continued_caption:
    source: "规范第 9.2.2 条：需要转页排时，须在续表上方居中位置分别用中、英文注明“续表 X-X”，续表的表头应重复排出"
  equation_number:
    source: "规范第 9.2.3 条：表达式……用阿拉伯数字分章编号。序号须加圆括号，右顶格排；序号应标注在最后一行的最右边"
  abstract_text:
    source: "规范第 6 条：硕士生学位论文要求不少于500字（博士生不少于1500字，见 manual）；摘要中不可出现图片、表格、公式或其他插图材料"
    zh_min_chars: 500
    no_figures: true
  appendix_number:
    source: "规范第 12 条附录：附录的序号用Ⅰ，Ⅱ，Ⅲ，Ⅳ……系列，如附录Ⅰ，附录Ⅱ"
    style: roman
  chapter_number:
    source: "规范第 9.1 条：章序中的序号用阿拉伯数字表示，如“第1章 XXXXX”"
  figure_citation:
    source: "规范第 9.2.1 条：图在文中的布局要合理，一般随文编排，先见相应文字后见图"
  citations:
    source: "规范第 10 条：按中文引用的参考顺序进行编号，编号时使用阿拉伯数字，并加方括弧；论文中未引用的文献不得出现"

layout:
  table_span:
    source: "规范第 9.2.2 条：表格较大、需要转页排时，须在续表上方居中位置注明“续表 X-X”，续表的表头应重复排出"
  first_chapter_odd_page:
    source: "规范第 9.1 条一级标题：每章开始应另起一页，并须位于奇数页面"
  new_page:
    source: "规范第 9.1 条一级标题：每章开始应另起一页"
    roles: [chapter]
  page_start:
    source: "规范第 15 条页脚：摘要至目录用大写罗马数字（Ⅰ，Ⅱ，Ⅲ……）单独编排；论文正文至最后用阿拉伯数字（1，2，3……）单独编排"
    front_first: 1
    body_first: 1

manual:
  - {text: "博士学位论文摘要不少于 1500 字（本规则包按硕士下限 500 字检查）。", source: "规范第 6 条摘要正文"}
  - {text: "英文关键词中，词组首字母须大写，如“Quantum error correcting codes”；中文“摘要”的英文译名统一为“ABSTRACT”。", source: "规范第 6 条关键词；模板《河南科技大学研究生学位论文模板（自然科学类）》摘要说明"}
  - {text: "页眉：自摘要起每页均有页眉；摘要页为“摘要”，英文摘要为“ABSTRACT”，符号表、目录、参考文献、缩略语词汇表、附录（不论几个）、致谢、攻读学位期间的研究成果页眉均为同名标题；中英文摘要页眉下加双横线，宽度 1/2 磅；正文奇数页页眉为各章一级标题，偶数页为“河南科技大学硕士学位论文”（或“河南科技大学博士学位论文”）。", source: "规范第 15 条页眉"}
  - {text: "页脚页码位置为外侧（奇数页右、偶数页左）。", source: "规范第 15 条页脚“外侧”"}
  - {text: "图、表一般随文编排；图与正文、表与正文之间有一行间距；所有图、表需有中、英文图题表题（先中文后英文），图序、表序与题名间空一个字符；英文图序为“Fig. X-X”，英文表序为“Tab. X-X”，其后空一个字符；分图用 (a)，(b)，(c)……编号。", source: "规范第 9.2 条图、表"}
  - {text: "表的编排采用国际通行的三线表（规范未给线宽）；图表中文字以五号字为准，排列过密时可小于五号字，但不得小于六号字。", source: "规范第 9.2.2 条、第 9.2 条图表中文字"}
  - {text: "附录中的公式、图、表分别编为 (Ⅰ-1)、图Ⅰ-1、表Ⅰ-1；每个附录应有标题。", source: "规范第 9.2.3 条注"}
  - {text: "参考文献：硕士不少于 45 篇（英文一般不少于 15 篇），博士不少于 100 篇（英文一般不少于 40 篇）；按 GB/T 7714 著录，作者不超过 3 位全部列出，超过 3 位只列前 3 位（中文加“等”，外文加“et al”）；以近 5 年文献为主。", source: "规范第 10 条篇数要求、书写要求"}
  - {text: "文献引用标注为上标，Times New Roman 体，小四号，如 [1]、[1-3,5]。", source: "规范第 9.3 条文献引用标注"}
  - {text: "论文字数：博士不少于 5 万字，硕士不少于 3 万字，两年制专业硕士不少于 2 万字。", source: "规范第 3 条字数"}
  - {text: "自中文摘要起论文各部分双面印刷。", source: "规范第 16 条印刷及装订要求"}
  - {text: "表达式需另行起排；较长而必须转行时，只能在 +、－、×、÷、= 等符号处转行，上下式在等号处对齐；序号用 Times New Roman 体，小四号。", source: "规范第 9.2.3 条表达式；第 9.2 条公式"}
  - {text: "段、节、条、项的标题与序号要求：各层次标题一律用阿拉伯数字连续编号，数字间用英文小圆点相隔，末位数字后不加点号；项序依次用“1．”“(1)”“①”。", source: "规范第 9.1 条"}
