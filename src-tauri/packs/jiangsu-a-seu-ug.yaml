manual:
- text: 论文题目应简明扼要，中文题目一般不超过 20 个汉字，副标题另起一行、用破折号与主标题隔开。
  source: 《撰写规范》一1
- text: “摘要”两字之间空 4 个半角空格；中文摘要一般为 400 字左右，内容包括研究目的、方法、过程、成果、结论及主要创新之处。
  source: 《撰写规范》二2(2)、一3
- text: 英文摘要应与中文摘要相对应，250 个实词左右，采用第三人称（被动语态），基本时态为一般现在时；英文关键词“KEY WORDS”大写，其后关键词第一个字母大写。
  source: 《撰写规范》一4、二2(2)
- text: 目录一般使用三级标题；“目录”两字之间空 4 个半角空格；目录中一级节标题行缩进 2 个字符，二级节标题行缩进 4 个字符。
  source: 《撰写规范》一5、二2(3)
- text: 正文一般不少于 15000 字。
  source: 《撰写规范》一6
- text: 插图每个均应有图序和图名；图序一般按章节编排（如图 1-1），插图较少时可全文连续编序；表格可逐章编序（表 2.1）或统一编序，采用哪种方式应和插图及公式的编序方式统一；分图用 (a)、(b)、(c) 标出并标出分图名。
  source: 《撰写规范》一6(1)(2)
- text: 公式应用公式编辑器编制，注序号并加圆括号，序号一律用阿拉伯数字连续编序（如（28））或逐章编序（如（3.6）），编号方式应与插图、表格方式一致；序号排在版面右侧；长公式原则上在等号（或 +、- 等数学符号）处换行，数学符号在换行的行首。
  source: 《撰写规范》一6(3)
- text: 注释只限于写在注释符号出现的同页，不得隔页。
  source: 《撰写规范》一6(4)
- text: 参考文献每条著录均以“.”结束；标点符号均为英文标点；参考文献要一律放在正文之后，不得放在各章节之后；著录符合 GB/T 7714-2015。
  source: 《撰写规范》一7、二2(8)
- text: 致谢字数一般不超过 1000 个汉字。
  source: 《撰写规范》一9
- text: A4 纸张单面打印（页数较多时可双面），装订线位置居左 0.5cm。
  source: 《撰写规范》三1
- text: 摘要标题、目录标题、致谢标题两字之间空 4 个半角空格；致谢内容小四号宋体、1.5 倍行距；公式及一般变量用斜体，常用函数、单位符号等用正体。
  source: 《撰写规范》二2(2)(3)；参考模板致谢、公式说明
