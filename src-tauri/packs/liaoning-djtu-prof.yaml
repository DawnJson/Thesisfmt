manual:
- text: 页眉：前置部分（摘要至目录）为“本章标题”；正文起奇数页为“本章标题”，偶数页为“大连交通大学专业学位硕士学位论文”；页眉下方加一条页眉横线，为加粗、细双线（粗线在上，1.5磅）。
  source: 模板批注（页眉页脚）
- text: 中文摘要字数400-500字左右；关键词上方空一行；中文题目不超过25个汉字，不设副标题；硕士学位论文一般为3~5万字。
  source: 模板批注（封面、摘要、正文）
- text: 章节序号与标题间空一格；“摘要”“目录”“结论”“致谢”两字间空2格，“参考文献”四个字每字间隔1个空格。
  source: 模板批注（各章标题）
- text: 二级、三级标题段前0.5行；图与上文空一行、图名与下文空一行；表名与上文空一行、表格与下文空一行；间距以“行”为单位，引擎不能表达，需人工核对。
  source: 模板批注（标题、图题、表题）
- text: 图片以嵌入式插入、居中，图名位于图片正下方，图名中不使用标点符号，图名在图号之后空1个空格；表格采用三线表，表格居中，表格内文本一般居中；表序与表名之间空1个空格，表名中不使用标点符号。
  source: 模板批注（图题、表题）
- text: 分图以全角括号 a）、b）、c）…… 作图序放在图左上角（博士模板为“（a）”），分图名列在主图名后用冒号引出，分图之间用逗号间隔。
  source: 模板批注（分图）
- text: 包含公式的段落行间距可设置为段前和段后6磅，1.5倍行距，以保证公式完全显示。
  source: 模板批注（公式）
- text: 引用的参考文献用阿拉伯数字编号标注，前后加中括号，Times New Roman，小五号，上标；参考文献数量不少于30篇，并包含一定数量的外文期刊；编号与内容之间空1格；著录遵循 GB/T 7714。
  source: 模板批注（参考文献）
- text: 数值和单位符号之间一般需要空格（如 10 kg），度、分、秒除外；一般变量用斜体，常量与单位用正体。
  source: 模板批注（结论）
- text: 封面：分类号、学号、题目、学生姓名等按模板批注格式填写（封面不在检查范围）。
  source: 模板批注（封面）
- text: 表题位于表格正上方，中文表题之下另起一行为英文表题（Tab. 1.1 Table name）；因英文表题紧邻表格，引擎“表题在表上方”检查会误报，未启用，请人工确认。
  source: 模板批注（表题）及模板示例格式
