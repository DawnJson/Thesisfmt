manual:
- text: 奇数页页眉只写每一章对应的章名，偶数页页眉为“黑龙江大学硕（博）士学位论文”，居中，单倍行距；版芯上边线隔一行加粗、细双线（上细下粗，粗线宽 0.8mm）。
  source: 《黑龙江大学研究生学位论文撰写规范（文科试用本）》（2026年3月）第六章三
- text: 正文一级标题、二级标题居中书写，其它标题靠正文左边顶格；主体部分章、节、款、项采用中文数字分级编号（第一章、第一节、一、……），分级编号至第四级止。
  source: 《黑龙江大学研究生学位论文撰写规范（文科试用本）》（2026年3月）第六章三、第四章第二节
- text: 关键词 3-5 个，隔行顶格排在摘要左下方，中文关键词排在中文摘要页；中文摘要硕士不宜超过 300 字、博士不宜超过 500 字；规范未规定关键词分隔符，故不启用关键词检查。
  source: 《黑龙江大学研究生学位论文撰写规范（文科试用本）》（2026年3月）第六章二
- text: 注释使用页下注，以页为单位连续编号，编号用数字加圈标注；参考文献序号左顶格用方括号标注，一律放在论文结论后；硕士参考文献一般不低于 30 篇，博士不低于 100 篇（外文不少于 1/3）。
  source: 《黑龙江大学研究生学位论文撰写规范（文科试用本）》（2026年3月）第一章第四节、第五章第一节
- text: 博士学位论文的扉页、摘要、目录等英文部分另起一页；版芯一般为 150mm×215mm（含页眉页码则为 150mm×235mm）。
  source: 《黑龙江大学研究生学位论文撰写规范（文科试用本）》（2026年3月）第六章三
