layout:
  new_page:
    source: "学院模板「章节标题格式」1)：每一章新起一页（分节符下一页）；校规范「摘要」：英文摘要另起一页"
    roles: [chapter, abstract_title_en]

manual:
  - {text: "标点符号全文统一使用中文标点；参考文献标点要么全中文要么全英文，保持统一。", source: "学院模板「行文风格」(1)(4)；「注意标点使用要统一」"}
  - {text: "摘要约600-700字、大约控制在1页内（校规范写中文摘要一般不超过500字，两者不一致，需按学院要求确认）。", source: "学院模板「摘要」提示；校规范「2．摘要」"}
  - {text: "摘要后空一行，顶格写关键词；“关键词”三字用宋体四号加粗。", source: "学院模板「摘要」；校规范「三、字体与标题的一般设置」"}
  - {text: "页眉要更改为你的名字跟论文标题。", source: "学院模板「章节标题格式」注意"}
  - {text: "图、表都要有编号与题目，且必须在正文中被引用；表应在软件内绘制，不得使用截图；图应清晰，图中文字接近5号字。", source: "学院模板「相关技术和开发环境」"}
  - {text: "公式使用公式编辑器输入，右侧有编号，文中有引用。", source: "学院模板「公式」"}
  - {text: "目录应在最后生成，目录中必须标明页码；一、二、三级标题构成正确的目录导航。", source: "学院模板「章节标题格式」5)；校规范「四、其他设置」2"}
  - {text: "粘贴代码须为文本而非截图，用五号字体、固定行距17磅，展示代码40-50行左右。", source: "学院模板「系统实现」"}
  - {text: "参考文献建议10-15条，序号左顶格[1]、[2]，著录按GB/T 7714格式。", source: "学院模板「参考文献」"}
  - {text: "毕业设计总字数可控制在15000字以内（含图表）。", source: "校规范「三、其他要求」1；学院模板「详细设计」"}
