checks:
  keywords:
    source: "规范二（二）：关键词要求3-6个；四（二）1：中文关键词之间用“，”相隔；四（二）2：英文关键词之间用英文半角“,”相隔"
    min_count: 3
    max_count: 6
    zh_separator: "，"
    en_separator: ","
  abstract_text:
    source: "规范二（二）：中文摘要一般不少于400汉字"
    zh_min_chars: 400
  caption_numbering:
    source: "规范四（六）：图号编码用章序号，如“图3.1”表示第3章第1图；四（七）：表号用章序号编码，如“表3.1”"
  table_caption:
    source: "规范四（七）：表题置于表的上方居中"
  figure_caption:
    source: "规范四（六）：图题置于图的正下方"
  table_cell:
    source: "模板《2021届毕业设计（论文）模板》表格说明：表格中的文字大小一般为五号宋体（规范未作文字规定）"
    cn_font: 宋体
    size: 五号
  citations:
    source: "规范二（七）：参考文献按引用文献的顺序，统一编号，列于文末；四（四）4：文内引用用方括号和阿拉伯数字按顺序标注"

layout:
  toc:
    source: "规范二（三）：目录由毕业设计（论文）的章、节、条、附录等的序号、名称和页码组成"
  new_page:
    source: "规范四（三）1：一级标题（章）另起一页"
    roles: [chapter]
  page_start:
    source: "规范四（四）2：正文页码：从正文开始页脚重新编排页码，阿拉伯数字连续编页"
    body_first: 1

manual:
  - {text: "摘要页眉左端为“大连科技学院****届本科毕业设计（论文）”，右端为“摘要”/“Abstract”；正文页眉为“大连科技学院XXXX届本科毕业设计（论文）”，居中。", source: "规范四（二）、四（四）1"}
  - {text: "“关键词”三字（英文为“Key Words”）加粗，最后一个关键词后无标点符号。", source: "规范四（二）1、2"}
  - {text: "参考文献序号用阿拉伯数字加方括号，与内容用一个半角空格分隔，每条以实心点结束；一行排不下时换行缩进，与第一个词对齐。", source: "规范四（五）2"}
  - {text: "参考文献不少于10篇，至少有一篇外文参考文献；引用网络资源须为官方网站公布内容。", source: "规范二（七）、四（五）3"}
  - {text: "图号、图题与图例在同一页；表题与表在同一页；图中标注文字、表中内容字号原则上不大于图题、表题的字号。", source: "规范四（六）、（七）"}
  - {text: "公式一般单行居中排版，式号与公式同行居右侧，按章序号编号，如式（3-1）。", source: "规范四（八）公式"}
  - {text: "题目应简短明确，字数一般不超过20个字。", source: "规范二（一）封面"}
