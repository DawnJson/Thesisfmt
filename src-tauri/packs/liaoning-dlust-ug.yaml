# 依据：《大连科技学院毕业设计（论文）规范化要求》（下称「规范」）与教务处发布的《2021届毕业设计（论文）模板》（下称「模板」，模板内的说明文字同为学校规定）。
page:
  source: "规范四（一）版面要求：纸张A4；页边距上、下、左、右各2.5cm；页眉边距1.5cm，页脚边距1.75cm"
  paper: A4
  margins_cm: {top: 2.5, bottom: 2.5, left: 2.5, right: 2.5}
  header_distance_cm: 1.5
  footer_distance_cm: 1.75

page_numbers:
  source: "规范四（二）：自摘要页起加页脚，摘要、目录共同编页码，采用大写罗马数字，Times New Roman小五号居中；四（四）2：正文页脚重新编排页码，阿拉伯数字，Times New Roman小五号，页底居中"
  front_format: upperRoman
  body_format: decimal
  footer_align: center
  footer_latin_font: Times New Roman
  footer_size: 小五
  restart_at: 1
  cover_no_number: true

# 摘要、目录页眉左端“大连科技学院****届本科毕业设计（论文）”、右端“摘要”/“Abstract”，正文页眉居中，两者不同，故不写 content / align，见 manual。
