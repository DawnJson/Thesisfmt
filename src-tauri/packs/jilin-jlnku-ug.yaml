manual:
- text: 封面按首页格式制作，摘要、目录、主体部分均单面打印；纸张A4单面打印，左侧装订。
  source: 《模板》1.2、3.1-3.4
- text: 页眉填写内容是“毕业论文（设计）中文题目”，模板中已设置字体字号，只需替换内容。
  source: 《模板》1.3
- text: 章节编号各层次全部顶格排，其后空1个汉字的间隙接排标题，标题末尾不加标点；不同层次数字之间用下圆点相隔，末位数字后不加点号。
  source: 《模板》1.5
- text: “摘要”两字中间空四个汉字（中文状态下按四次空格键）；“参考文献”四个字之间空一个空格；“致谢”两字间隔两个字符；“结论”标题黑体、居中、三号、1.5倍行距、段后1行、段前0行。
  source: 《模板》摘要页说明、2.4.2（4）、结论与致谢页说明
- text: 表、图序号后面留两个字符（汉字状态敲两次空格键）；图与上文之间留一空行，图名与下文留一空行；表名与上文留一空行，表格与下文留一行空格；图、表居中排列。
  source: 《模板》2.1.1、2.1.2、2.2.1、2.2.2
- text: 图的版式为“上下型”或“嵌入型”，不得“浮于文字之上”；图及其名称要放在同一页中，不能跨接两页。
  source: 《模板》2.1.2（3）（4）
- text: 表要用WORD绘制，不要粘贴，一律采用三线格（规范未给出线宽）；表尽量以一页为限，超限要加续表，续表并重复表头和关于单位的陈述。
  source: 《模板》2.2.2
- text: 公式另起一行居中排；较长公式尽可能在等号处回行，或在“+”“－”等符号处回行；公式的编号右端对齐，公式与编号之间用“······”连接；公式下“式中：”空两个字起排，单独占一行。
  source: 《模板》2.3
- text: 引用的文献在正文中用方括号和阿拉伯数字按顺序以右上角标形式标注；参考文献按 GB 7714 著录，作者少于3人全部写出，3人以上只列前3人加“等”或“et al”；附录中的图、表、附注、参考文献、公式另行编号，如图A1、表B2、文献[A3]。
  source: 《模板》1.7、2.4
- text: 摘要应说明研究工作目的、实验方法、结果和最终结论；关键词最后不加标点符号；外文摘要使用第三人称，最好采用现在时态。
  source: 《模板》摘要页、Abstract页说明
- text: 章、节、三级标题要求居左；学校模板的标题样式为两端对齐（单行标题视觉上与居左相同），故对齐方式未检查，需人工核对。
  source: 《模板》1.5
- text: Abstract 正文用 Times New Roman，小四；英文关键词用 Times New Roman。
  source: 《模板》Abstract页说明
