manual:
- text: 装订线位置为左，0.5 cm（页面设置中的装订线，规则包页面设置无此字段）。
  source: 规范 一
- text: 页眉内容：正文部分加“大章节序号和名称”，“参考文献、翻译部分、附录”不加序号。
  source: 规范 一
- text: 毕业设计（论文）用 A4 纸单面打印；论文题目要醒目、简短，字数不得超过 25 个。
  source: 规范 一；二⒊
- text: 致谢内容限 1 页，采用小四号楷体。
  source: 规范 二⒉
- text: 英文摘要“ABSTRACT”应与中文摘要相对应，中文在前、英文在后；目录分中文目录、英文目录。
  source: 规范 二⒌、二⒍
- text: 正文每章前加序号（序号后空一格），英文标题与中文标题对应；三级标题不需要翻译成英文。工科专业毕业设计说明书（程序设计说明书）正文 15000–20000 字。
  source: 规范 二⒎
- text: 参考文献不少于 20 篇，其中外文不少于 5 篇；作者只写到第三位，余者写“等”；先列直接引用的资料，再列直接阅读且被参考的资料；一律放在正文之后，不得放在各章节之后；序号用中括号，与文字之间空一格，第二行文字与第一行文字对齐。
  source: 规范 二⒏
- text: 表序必须连续，不得重复或跳跃；表中各栏标注量和单位，数字上下对齐，相邻栏数值相同不得用“同上”“同左”。
  source: 规范 三⒉
- text: 插图要精选；分图用 a、b、c……标出；图序必须连续，不得重复或跳跃。
  source: 规范 三⒊
- text: 公式用公式编辑器编排，重要公式或后文重提的公式注序号并加圆括号，序号用阿拉伯数字逐章编序（如（3.6.1）），排在版面右侧且距右边距离相等，公式与序号之间不加虚线。
  source: 规范 三⒋
- text: 翻译部分：标题黑体小2加粗居中；“英文原文”“中文译文”为黑体3号居左顶格；内容宋体小4号、固定值20磅，英文 Times New Roman 5号；中文译文不少于 3000 汉字。
  source: 规范 二⒐
- text: 表序和表题置于表格上方中间位置（模板中表题为中英文双行，程序的“表题在表上方”检查会把紧邻表的英文题注判为无表题，故不启用该项检查，请人工确认）。
  source: 规范 三⒉
