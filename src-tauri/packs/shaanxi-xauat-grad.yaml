checks:
  keywords:
    source: "撰写标准二（二）1：关键词3—5个，之间用“；”分开；表3.3：英文关键词之间用英文分号“;”"
    min_count: 3
    max_count: 5
    zh_separator: "；"
    en_separator: ";"
  caption_numbering:
    source: "撰写标准二（二）4（2）：所有插图应按分章编号，如图1.3；表格应按章编号，如表2.1"
  table_caption:
    source: "撰写标准二（二）4（2）2)③：表的编号表题应从表格上方居中排列"
  figure_caption:
    source: "撰写标准二（二）4（2）1)①：图的编号及图名应在图的下方居中标出"
  figure_citation:
    source: "撰写标准二（二）4（2）1)③：插图须紧跟文述，一般应先见图号及图的内容后再见图"
  table_lines:
    source: "撰写标准二（二）4（2）2)①：三线表，表的上、下边线为单直线，线粗1.5磅；第三条线为单直线，线粗1磅（必要时可加辅助线）"
    top_bottom_pt: 1.5
    header_pt: 1.0
  table_cell:
    source: "撰写标准二（二）4（2）2)②：表单元格中的文字一般应居中书写（上下居中，左右居中），不宜居中的可两端对齐；表3.6：中文五号宋体、英文五号 Times New Roman（内容过多可用小五号，故不限制字号）"
    cn_font: 宋体
    latin_font: Times New Roman
    align: center
  equation_number:
    source: "撰写标准二（二）4（2）3)：公式均需有公式号，公式号置于小括号中，如公式（2-3），写在右边行末"
  chapter_number:
    source: "撰写标准二（二）2(1)：目录中章、节号均使用阿拉伯数字，如章为“第1章”，分层次序为1.1及1.1.1"
  footnotes:
    source: "撰写标准二（二）5：注释（脚注）列于页脚处，用阿拉伯数字加圆圈标注，如“①”；表3.5：小五号宋体、英文小五号 Times New Roman，单倍行距"
    format:
      source: "撰写标准表3.5：脚注置于页脚处，中文小五号宋体，英文小五号 Times New Roman，单倍行距"
      cn_font: 宋体
      latin_font: Times New Roman
      size: 小五
      line: {rule: auto, value: 1.0}
    circled: true

layout:
  toc:
    source: "撰写标准二（二）2：目录由编号、标题和页码组成，页码从正文开始直至全文结束"
  new_page:
    source: "撰写标准二（二）2：目录页排在中英文摘要之后，另页右面起"
    roles: [toc_title]

manual:
  - {text: "偶数页页眉为“西安建筑科技大学博士学位论文”或“西安建筑科技大学硕士学位论文”（按学位层次，不作自动检查）；页眉线型 1.5 磅，上粗下细。", source: "撰写标准表3.1"}
  - {text: "目录页另页右面起，目录页码另编。", source: "撰写标准二（二）2"}
  - {text: "中文论文题目一般不宜超过35字；摘要正文博士约1000—1500字、硕士约700—1000字。", source: "撰写标准二（一）1、二（二）1"}
  - {text: "参考文献：自然科学类序号与正文标引序号一致；人文社科类可按类别分别列出并按统一顺序编号；格式按 GB/T 7714—2015，序号方括号，条目末尾以“.”结束，标点符号均采用半角。", source: "撰写标准二（二）5、表3.6"}
  - {text: "硕士论文参考文献一般不少于40篇（期刊不少于30篇，国外文献不少于15篇），博士一般不少于100篇（期刊不少于80篇，国外不少于40篇），均以近5年文献为主。", source: "撰写标准二（二）5"}
  - {text: "封面、指导教师团队页、答辩委员会页、声明页、中英文内页封面采用研究生院统一提供的模板。", source: "撰写标准二（一）、三（二）（三）"}
  - {text: "正文层次标号：第一级（1）（2）（3），第二级1）2）3），第三级①②③。", source: "撰写标准二（二）4（3）5)"}
  - {text: "图中字号尽量采用五号宋体字（字数较多时可用小五号），同一插图内字号统一；坐标图边框为 0.5 磅实线；所有插图须统一注明资料来源。", source: "撰写标准二（二）4（2）1)⑨⑩、表3.6"}
  - {text: "学位论文要求双面打印装订。", source: "撰写标准三（九）"}
