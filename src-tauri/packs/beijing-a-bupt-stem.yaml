checks:
  keywords:
    source: "《写作与制作规范》二（五）：摘要后列出 3-5 个关键词，之间用分号相隔；英文分隔符规范未作文字规定，取附件2 模板示例“KEY WORDS: keyword1; keyword2”"
    min_count: 3
    max_count: 5
    zh_separator: "；"
    en_separator: ";"
  caption_numbering:
    source: "《写作与制作规范》三（十）（十一）：图的编号由“图”和从“1”开始的阿拉伯数字组成，图1-1；表1-1"
  table_caption:
    source: "《写作与制作规范》三（十一）：表的编号和表题应居中置于表上方"
  figure_caption:
    source: "《写作与制作规范》三（十）：图的编号和图题应居中置于图下方"
  continued_caption:
    source: "《写作与制作规范》三（十一）：如某个表需要转页接排，续表均应重复表头，如“续表2-1 XXXX”"
  equation_number:
    source: "《写作与制作规范》三（十二）：公式编号置于括号内，公式的编号右端对齐（1-1）"
  abstract_text:
    source: "《写作与制作规范》二（六）：英文摘要其后列出与中文相对应的外文关键词"
    keywords_match: true
  citations:
    source: "《写作与制作规范》二（十）：引用参考文献时，应在引出处的右上方用方括号标注阿拉伯数字编排的序号；参考文献的排列按照文中引用出现的顺序列出"

layout:
  table_span:
    source: "《写作与制作规范》三（十一）：如某个表需要转页接排，续表均应重复表头，如“续表2-1 XXXX”"
  new_page:
    source: "《写作与制作规范》五：论文每一部分内容以及正文部分的每一章均从奇数页开始；三（九）：每一章另起一页；三（十四）：参考文献另起一页"
    roles: [abstract_title_zh, abstract_title_en, toc_title, chapter, references_title, appendix_title, ack_title]
  first_chapter_odd_page:
    source: "《写作与制作规范》五：论文每一部分内容以及正文部分的每一章均从奇数页开始"
  page_start:
    source: "《写作与制作规范》三（十三）：页码从第一章（绪论）开始按阿拉伯数字（1，2，3，……）连续编排，之前的部分用大写罗马数字（Ⅰ，Ⅱ，Ⅲ，……）连续编排"
    front_first: 1
    body_first: 1

manual:
  - {text: "页眉分奇、偶页标注：奇数页为章序及章标题，偶数页为“北京邮电大学硕士学位论文”或“北京邮电大学博士学位论文”；页眉下横线为单实线；页码数字两侧不加“-”等修饰线。", source: "《写作与制作规范》三（十三）"}
  - {text: "章节编排：理学、工学、医学类建议采用“第一章，1.1，1.1.1”逐级递推；章节标题简明扼要，无标点符号。", source: "《写作与制作规范》三（九）；二（九）"}
  - {text: "关键词：“关键词：”黑体四号，其后关键词宋体四号；“KEY WORDS:”四号加粗。", source: "《写作与制作规范》三（四）（五）"}
  - {text: "独创性（或创新性）声明和使用授权说明：标题黑体三号居中，单倍行距；内容宋体小四，两端对齐，首行缩进 2 字符，固定值 20 磅。符号说明、作者学习经历、创新成果目录的标题同样黑体三号居中。", source: "《写作与制作规范》三（三）（七）（十七）（十八）"}
  - {text: "引文、语料、教学案例等内容可用楷体五号。", source: "《写作与制作规范》三（八）"}
  - {text: "表的编排一般采用国际通行的三线表；有英文标题时以 Figure 1-1、Table 1-1 编号；全文编号方式应统一；图题、表题的图序与图名之间空一格，图名后不加标点。", source: "《写作与制作规范》三（十）（十一）"}
  - {text: "分图分别以 (a)、(b)、(c)…… 作为图序，并须有分图名。", source: "《写作与制作规范》三（十）"}
  - {text: "公式另起一行居中横排，较长的公式只可在符号处（+、-、*、/、≤、≥等）转行；语料、案例编号置于括号内，以“章”为单位更新。", source: "《写作与制作规范》三（十二）"}
  - {text: "论文题目（包括副题和标点符号）不得超过 36 个汉字。", source: "《写作与制作规范》三（二）"}
  - {text: "参考文献著录项目和格式原则上遵照 GB/T 7714—2015。", source: "《写作与制作规范》四"}
  - {text: "页边距：装订线位置左侧，装订线 0 cm；纸质论文双面打印。", source: "《写作与制作规范》五"}
