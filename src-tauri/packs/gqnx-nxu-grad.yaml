page:
  source: "模板§2.3.1 页面设置：页边距：上3cm，下3cm，左3cm，右2.5cm，装订线靠左0.5cm位置。页眉：2.5cm。页脚：2.5cm（左边距与装订线的关系不明，未检查左边距）"
  paper: A4
  margins_cm: {top: 3.0, bottom: 3.0, right: 2.5}
  cover_margins_cm:
    - {name: 封面及声明页, source: "模板《附件4：宁夏大学学位论文模板（2025版）》前三节示例页面设置（规范未作文字规定）", top: 2.54, bottom: 2.54, left: 3.0, right: 2.0}
  header_distance_cm: 2.5
  footer_distance_cm: 2.5

page_numbers:
  source: "模板§2.3.1：页码从摘要开始，前置部分用大写罗马数字，正文从绪论首页作为第1页按阿拉伯数字连续编排；页码统一标注在每页页脚中部，采用Times New Roman，小五号居中书写"
  front_format: upperRoman
  body_format: decimal
  footer_align: center
  footer_latin_font: Times New Roman
  footer_size: 小五
  restart_at: 1
  cover_no_number: true

