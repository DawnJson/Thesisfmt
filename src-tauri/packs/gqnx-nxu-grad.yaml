  page_start:
    source: "模板§2.3.1：页码从摘要开始用大写罗马数字连续编排；正文从绪论首页作为第1页"
    front_first: 1
    body_first: 1

manual:
  - {text: "页眉从摘要页开始到论文最后一页均需设置；内容左对齐为“宁夏大学硕士学位论文”（博士为“宁夏大学博士学位论文”），右对齐为各章章名。", source: "模板§2.3.1 页面设置"}
  - {text: "页码数字两侧不要加“－”等修饰线；力求不出空白页，如有仍应以右页作为单页页码。", source: "模板§2.3.1 页面设置"}
  - {text: "英文与数字夹杂在黑体中文中时，英文与数字用 Times New Roman 并加粗。", source: "模板§2.3.2 字体"}
  - {text: "论文内容依次为：封面、中文摘要、英文摘要、目录、符号说明、论文正文、参考文献、附录、致谢、攻读学位期间发表的相关学术成果。", source: "模板§2.1 论文正文"}
  - {text: "字数：硕士学位论文（学术型、专业型）不少于30000字，博士不少于80000字，也可根据各学科自定。", source: "模板§2.2 字数要求"}
  - {text: "参考文献按学科需求，在顺序编码制、著者-出版年制、APA/MLA 三类著录格式（附件1-3）中选一种排版。", source: "模板「参考文献」说明；附件1-3"}
