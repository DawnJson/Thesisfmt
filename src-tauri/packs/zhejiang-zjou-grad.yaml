# 依据：《硕士研究生论文撰写与印制规范（试行）》（浙江海洋大学研究生院，2010 年 1 月），下称“规范”。
# 学术型与专业学位两份模版的格式规定相同，合用一个规则包。

page:
  source: "规范2.2：研究生学位论文一律用A4纸双面打印，页边距分别为：左3cm，上3cm；右2.5 cm，下2.5 cm"
  paper: A4
  margins_cm: {top: 3.0, bottom: 2.5, left: 3.0, right: 2.5}

page_numbers:
  source: "规范2.5.3：论文除内外封外，均应居中编排页码；正文部分从第一章开始采用阿拉伯数字编页码；3.1 数字、英文字母均采用Times New Roman体"
  body_format: decimal
  footer_align: center
  footer_latin_font: Times New Roman

headers:
  source: "规范3.3：学位论文除内封外均加页眉，并居中打印，宋体小5号字（奇数页章题序及标题、偶数页论文标题，偶数页内容因人而异未检查）"
  align: center
  cn_font: 宋体
  size: 小五

