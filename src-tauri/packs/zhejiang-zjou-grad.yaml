checks:
  keywords:
    source: "规范1.4：关键词一般列3～5个；2.3 关键词中间用分号隔开，如：关键词：××；××；××"
    min_count: 3
    max_count: 5
    zh_separator: "；"
    en_separator: ";"
  caption_numbering:
    source: "规范2.12：表序按章编排，如第一章第一个插表的序号为“表1-1”；2.13 图号按章编排，如“图1-1”"
  table_caption:
    source: "规范2.12：表必须有简短确切的表名，表序与表名之间空一格置于表上，居中排列"
  figure_caption:
    source: "规范2.13：每个图均应有图题（由图号和图名组成）……图题置于图下居中编排"
  table_cell:
    source: "规范3.1：表号表名、图名图号以及表格中的文字均采用5号字体；数字、英文字母均采用Times New Roman体"
    latin_font: Times New Roman
    size: 五号
  equation_number:
    source: "规范2.11：公式序号按章编排，如第1章第一个公式序号为“（1-1）”，附录A中的第一个公式为（A-1）；序号标注于该式所在行的最右边"
  chapter_number:
    source: "规范3.3：奇数页眉“第？章”（所在章题序及标题，？处用阿拉伯数字）"
  citations:
    source: "规范1.8、2.6：论文中引用的文献必须列出，未引用的文献不得出现；参考文献的排列次序按论文中引用的先后排列；文献编号用阿拉伯数字加方括号"

layout:
  toc:
    source: "规范3.6：目录采用Word软件中自带的功能自动生成；2.4 目录应包括论文中全部章节的标题及页码"
  new_page:
    source: "规范2.5.1：论文正文分章节撰写，每章应另起一页"
    roles: [chapter]

manual:
  - {text: "页眉：学位论文除内封外均加页眉，居中打印，宋体小5号字。奇数页眉为“第？章 章标题”（所在章题序及标题，？处用阿拉伯数字），偶数页眉为学位论文标题；页眉标题为两个字时中间空出两个字的空格。", source: "规范3.3"}
  - {text: "页码格式如“－1－”；中英文“摘要”页、“目录”和“主要符号表”页用罗马字母编页码，正文从第一章开始用阿拉伯数字编页码。", source: "规范2.5.3"}
  - {text: "章节段的标题段前段后各 0.5 行，连续标题间行距仍为 0.5 行；各层次题序及标题不得置于页面最后一行；字间距为标准字间距，每页一般 36 行、38 列。", source: "规范3.2"}
  - {text: "正文中“摘要”“目录”“绪论”“结论”“致谢”等两个字标题，中间空出二个字的空格（如“摘︼︼要”）；目录中的两字标题中间不得留空格。", source: "规范3.1"}
  - {text: "中英文摘要页均不需写出论文题目；关键词采用黑体；摘要正文约 500 字，不宜使用公式、图表，不标注文献编号。", source: "规范1.4、2.3"}
  - {text: "目录一般至章节段三级标题，最多不超过四级标题；次级节标题比上级节标题缩进两个字符。", source: "规范3.6"}
  - {text: "各章标题字数一般在 15 字以内，不得使用标点符号；结论单独作为一章排写但不加章号，一般在 1000 字左右；前言部分字数不得少于 4000 字；硕士学位论文正文一般在 3 万字以上。", source: "规范1.7.1、1.7.3、2.5.1、2.1"}
  - {text: "第一章第一页应设置脚注，填写作者简介及项目来源、项目编号等信息。", source: "规范2.5.1"}
  - {text: "参考文献不应少于 60 篇，其中 70% 以上为学术论文；外文文献不少于三分之一（文科不少于 10 篇），近五年发表的文献不少于 10 篇。", source: "规范2.14"}
  - {text: "参考文献序号加方括号顶格书写，不加标点，换行时与作者名第一个字对齐；作者不超过 3 位全部列出，超过 3 位只列前 3 位加“等”；按 GB/T 7714 著录。", source: "规范2.14"}
  - {text: "文中文献编号用阿拉伯数字加半角方括号，置于所引内容最末句的右上角（上标），如“二次铣削[1，3-5]”；不得将引用文献标示置于各级标题处。", source: "规范2.6"}
  - {text: "表格不加左、右边线；表名中不允许使用标点符号，表名后不加标点；表格与正文之间留有单行间距；表内同一栏的数字必须上下对齐。", source: "规范2.12"}
  - {text: "图中有分图时分图号用 a)、b) 等置于分图之下；插图与其图题不得拆开排写于两页；图中各部分说明采用中文或文字符号并置于图题上。", source: "规范2.13"}
  - {text: "公式应另行居中横排；公式转行只能在 +、-、×、÷、＜、＞ 处；文中引用公式用“式（1-1）”；物理量符号用斜体，计量单位用正体。", source: "规范2.11、2.8、2.9"}
  - {text: "全日制研究生论文封面采用全校统一格式；中文题目不超过 20 字，不设副标题；论文原创性声明、知识产权权属声明须亲笔签名。", source: "规范1.1、1.3"}
