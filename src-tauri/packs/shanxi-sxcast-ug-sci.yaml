checks:
  keywords:
    source: "模板《自然科学类》示例格式（批注未规定分隔符）：中文“关键词：指标；UML；关系数据库；图表”，英文“Keywords: Criteria;UML;Relation database;Diagram”"
    zh_separator: "；"
    en_separator: ";"
  caption_numbering:
    source: "模板批注：文中的图、表、附注、公式的序号一律采用阿拉伯数字分章编号，如图 2-5，表 3-2，式(5-1)；图序前部分数字表示所在章的序号，后部分数字表示在该章的序号，如“图1-1 UML的发展历程”"
  table_caption:
    source: "模板批注：表序及表名置于表的上方，居中排写"
  figure_caption:
    source: "模板批注：图的编号和名称应下方居中，编号在前用阿拉伯数字，名称在后，末尾不加标点"
  table_cell:
    source: "模板批注：表格内文字：宋体五号，行距 15 磅，表头文字加粗"
    cn_font: 宋体
    size: 五号
    line: {rule: exact, value: 15}
  continued_caption:
    source: "模板批注：表格一页排不下允许下页接写，表头应重复写，并在右上方写“续表××”"
  equation_number:
    source: "模板批注：公式应居中书写，编号用中文括号括起写在右边行末；图、表、公式的序号分章编号，如式(5-1)"

layout:
  table_span:
    source: "模板批注：一张表格应为一个整体，表格一页排不下允许下页接写，表头应重复写，并在右上方写“续表××”"
  toc:
    source: "模板批注：目录自动生成，宋体，小四号，行距固定值 23.5 磅"
  new_page:
    source: "模板批注：参考文献（独立一页）；致谢（独立一页）；附录（独立一页）"
    roles: [references_title, ack_title, appendix_title]

manual:
  - {text: "封面：“毕业设计”或“毕业论文”按题目类型自行修改；表格中的内容居中对齐；标题宋体三号、一般不超过 25 字；“本科生毕业设计/论文”宋体小初、加粗、居中、单倍行距；学院、专业班级、姓名、学号、指导教师宋体三号加粗，数字用 Times New Roman；学校名称与日期宋体三号；专业填写全称，共同指导的指导教师须全部署名。", source: "模板封面页批注"}
  - {text: "原创性声明、关于毕业论文使用授权的声明：标题黑体小二号、居中，行距固定值 23.5 磅，标题上下各空一行。", source: "模板声明页批注"}
  - {text: "页眉：首页不同、奇偶页不同，第一页不添加页眉；奇数页为“作者姓名：毕业论文题目”（如“王某某：基于UML的电厂信息管理系统建模研究”），偶数页为“山西应用科技学院****届本科生毕业设计”或“山西应用科技学院****届本科生毕业论文”，与封皮保持一致。", source: "模板页眉批注"}
  - {text: "正文首页大标题（论文题目）：上下各空一行，黑体、小二号、加粗、行距固定值 23.5 磅，本页不添加页眉。", source: "模板批注"}
  - {text: "摘要内容一般 300 字左右；英文摘要关键词的首字母大写，“Keywords”加粗。", source: "模板摘要页批注"}
  - {text: "正文中编号用（1）、（2）等表示，下一级用①、②等表示；“（”为半个字符，首行缩进 1.5 字符。", source: "模板批注"}
  - {text: "图、表、公式等与正文之间要有一行的间距；插图与名称为一个整体，不能跨页；若图或表中有附注，采用英文小写字母顺序编号，附注写在图或表的下方。", source: "模板图表批注"}
  - {text: "表格线型：除表头、表尾横线实线外，其他为空线（三线表），表格不加左右边线；表中参数应标明量和单位的符号；表格应随文给出，先见文后见表。", source: "模板表格批注"}
  - {text: "参考文献：不要在一篇参考文献段落的中间换页；作者 3 名以内的全部列出，3 名以上列出前 3 名，后加“等”（英文加“etc.”）。", source: "模板参考文献批注"}
  - {text: "致谢正文：宋体小四号、行距固定值 23.5 磅、首行缩进 2 个字符；附录内容宋体五号、行距固定值 23.5 磅、首行缩进 2 个字符。", source: "模板致谢、附录批注"}
