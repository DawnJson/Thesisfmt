checks:
  keywords:
    source: "模板说明文字：关键词一般为 3～5 个，每个关键词不超过 5 个字；分隔符取自模板示例“【关键词】 ，，，，”"
    min_count: 3
    max_count: 5
    zh_separator: "，"
    en_separator: ","
  abstract_text:
    source: "模板说明文字：中文摘要一般为 300 字左右，不含公式、图表和注释；英文摘要与中文摘要的内容应一致，英文关键词与中文关键词一一对应"
    no_figures: true
    keywords_match: true
  caption_numbering:
    source: "模板说明文字：每一章的图、表、公式都要统一编号，如图 2.1、表 2.1、公式（2.1）"
  table_caption:
    source: "模板说明文字与示例：表编号和表标题位于表上方（示例格式）"
  figure_caption:
    source: "模板说明文字与示例：图编号和图标题位于图下方（示例格式）"

manual:
  - {text: "题目字数一般不超过 24 字，副标题字数一般不超过题目字数；英文题目应与中文题目一致。", source: "模板说明文字“题目的确定”“Abstract”部分"}
  - {text: "摘要应采用第三人称写法；章标题字数一般在 15 字以内；插图、表格先见文字后见图表，图（表）与标题不能破页；公式另行居中书写，编号加圆括号右对齐。", source: "模板说明文字"}
  - {text: "中文摘要一般为 300 字左右（无明确范围，不检查字数）。", source: "模板说明文字“摘要”部分"}
