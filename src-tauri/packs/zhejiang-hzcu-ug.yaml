# 学校只公布了 Word 模板（论文管理系统下载页），没有找到另行的文字规范，也没有“须按此模板”的通知；
# 模板内的说明文字只讲内容与编号，不给字体字号。故所有格式值均取自《2024届毕业论文（设计）模板》示例格式，verified 为 false。

