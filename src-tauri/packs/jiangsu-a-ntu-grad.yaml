manual:
- text: 正文与摘要首行缩进可取 0.92 厘米或 2 字符（引擎只检查字符数，未检查厘米写法）；章标题、目录标题、参考文献标题上下各空一行（模板用 17/16.5 磅间距实现，不检查）。
  source: 《格式要求》四（二）；模板批注“章标题上下各空一行”
- text: 摘要标题模板批注为黑体小三号（模板示例实际为宋体三号，以批注为准）；参考文献标题、致谢标题为黑体小三号。
  source: 模板批注（摘要、致谢）、模板文本框（参考文献）
- text: 参考文献用中括号的数字连续编号，顶格书写（模板示例为悬挂缩进）。
  source: 模板文本框（参考文献）
- text: 文中引用参考文献用方括号，括号内加半角阿拉伯数字为右上标。
  source: 模板批注“文中引用参考文献用方括号，括号内加半角阿拉伯数字为右上标”
- text: 中文摘要在本页最下方另起一行注明关键词（3-5 个）；英文摘要最下方一行为英文关键词（Keywords 3-5 个）。
  source: 模板批注（摘要、Abstract）
- text: 表序写在表题左方不加标点，空一格写表题，表题末尾不加标点；表格采用简明三线表；表格、插图可全文统一编序，也可逐章编序，序号必须连续，不得重复或跳缺。
  source: 模板批注（表题、图表）
- text: 公式另起一行，编号用圆括号括起、标注于该式所在行（有续行时为最后一行）的行末，可按章节或全文统一编号，序号必须连续；较长公式最好在等号处转行，否则在 +、-、×、÷ 等符号处转行，符号写在转行处的行首。
  source: 模板文本框（公式）
- text: 学位论文字数（不包括图表）：自然科学类博士一般不少于 5 万字；自然科学类学术学位硕士不少于 3 万字，人文社科类学术学位硕士不少于 4 万字；专业学位硕士按各专业学位类别要求。
  source: 《南通大学学位论文格式要求（2024版）》一
- text: 双面打印、胶装；装订后尺寸 285mm×205mm（版心 240mm×150mm）；封面博士深红色、学术学位硕士白色、专业学位硕士浅绿色。
  source: 《南通大学学位论文格式要求（2024版）》四
