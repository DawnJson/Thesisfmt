page:
  source: "规范「三、1 纸张要求及页面设置」：上方和左侧2.5cm，下方和右侧2cm，页眉1.5cm、页脚1.75cm，装订线0cm（纸张写作 210×290 mm，与 A4 不符，未检查纸张）"
  margins_cm: {top: 2.5, bottom: 2.0, left: 2.5, right: 2.0}
  header_distance_cm: 1.5
  footer_distance_cm: 1.75

page_numbers:
  source: "规范「二、2 页眉和页码」：页码位于页面底端，居中，从第1章（绪论）开始按阿拉伯数字连续编排，除封面和封底外的中文摘要、Abstract、目录等用大写罗马数字单独编排；「三、1」页码 Times New Roman 小五 居中"
  front_format: upperRoman
  body_format: decimal
  footer_align: center
  footer_latin_font: Times New Roman
  footer_size: 小五
  restart_at: 1
  cover_no_number: true

headers:
  source: "规范「二、2 页眉和页码」：页眉从绪论开始（摘要、目录等前置部分无页眉），奇偶页相同，宋体五号；页眉内容见 manual"
  front_none: true
  same_odd_even: true
  cn_font: 宋体
  size: 五号

roles:
  chapter:
    source: "规范「二、1」除大标题居中书写外；样本「第1章 绪论」示例格式：小二，固定值20磅（段前后样本各章不一致，未检查）；规范「二」英文和数字一般采用 Times New Roman"
    cn_font: 宋体
    latin_font: Times New Roman
    size: 小二
    align: center
    line: {rule: exact, value: 20}
  section_1:
    source: "规范「二」中文采用宋体，英文和数字一般采用 Times New Roman（节标题字号规范与样本均不统一，对齐只规定序号左顶格，均未检查）"
    cn_font: 宋体
    latin_font: Times New Roman
  section_2:
    source: "规范「二」中文采用宋体，英文和数字一般采用 Times New Roman（节标题字号规范与样本均不统一，对齐只规定序号左顶格，均未检查）"
    cn_font: 宋体
    latin_font: Times New Roman
  body:
    source: "规范「三、1」正文内容 宋体小四号；「二」英文和数字一般采用 Times New Roman；样本示例格式：固定值20磅（样本各段首行缩进不一致，未检查缩进）"
    cn_font: 宋体
    latin_font: Times New Roman
    size: 小四
    line: {rule: exact, value: 20}
  abstract_title_zh:
    source: "样本「摘 要」示例格式（规范未作文字规定）：四号宋体加粗居中"
    cn_font: 宋体
    size: 四号
    bold: true
    align: center
  toc_title:
    source: "样本「目 录」示例格式（规范未作文字规定）：四号宋体加粗居中"
    cn_font: 宋体
    size: 四号
    bold: true
    align: center
  references_title:
    source: "样本「参考文献」示例格式（规范未作文字规定）：四号宋体加粗居中"
    cn_font: 宋体
    size: 四号
    bold: true
    align: center
  ack_title:
    source: "样本「致 谢」示例格式（规范未作文字规定）：四号宋体加粗居中"
    cn_font: 宋体
    size: 四号
    bold: true
    align: center
  appendix_title:
