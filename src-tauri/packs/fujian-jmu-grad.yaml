# 集美大学研究生学位论文。
# 规范：《集美大学研究生学位论文规范》（下称「规范」）；规范写明“其它以论文样本格式为准”，
# 规范未作文字规定的字号等取《集美大学研究生学位论文样本》示例格式（下称「样本」）。
# 各学院（外国语、海洋文化与法律、马克思主义学院等）的样本为本校样本的学科变体，此处只按全校规范与全校样本。
