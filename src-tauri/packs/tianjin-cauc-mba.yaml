# 依据官方《中国民航大学硕士学位论文模板—专业学位(2022)》。模板自带逐项批注，写明各部分字体字号、对齐、段前后、行距，
# 批注即学校（MBA 教育中心）对论文格式的文字规定；下文 source 里的“模板批注”均指该文档的批注。

page:
