checks:
  keywords:
    source: "模板批注：中文关键词之间用全角分号“；”隔开，英文用半角分号“;”隔开，最后一个关键词后不打标点符号；关键词3-8个"
    min_count: 3
    max_count: 8
    zh_separator: "；"
    en_separator: ";"
  caption_numbering:
    source: "模板批注：论文公式应分章编号；表序“表1.1”“表1.2”、图序“图1-1”按章编号（模板示例）"
  table_caption:
    source: "模板批注：中文表题和英文表题置于表的上方（模板示例：表题在表前）"
  figure_caption:
    source: "模板批注：图名在图号之后空一格排写；主图名列在所有分图的下方正中"
  continued_caption:
    source: "模板表格批注：表需要转页接排时，在随后各页上应重复表的编号，如“表1.2 XXXX（续）”，且续表均应重复表头"
    style: suffix
  footnotes:
    source: "模板批注脚注：中文字体为宋体，西文字体为 Times New Roman，小五号，两端对齐，无缩进，段前0行，段后0行，单倍行距，每页重新编号"
    format:
      source: "模板批注脚注：宋体 / Times New Roman，小五号，两端对齐，无缩进，段前后0行，单倍行距"
      cn_font: 宋体
      latin_font: Times New Roman
      size: 小五
      align: justify
      line: {rule: auto, value: 1.0}
      before: 0
      after: 0
    restart_each_page: true

layout:
  toc:
    source: "模板批注目录：目录项显示到3级，注意保持页码右对齐，有前导符，正文修改后注意刷新目录"
  new_page:
    source: "模板批注：摘要、Abstract、目录、每一章、结论、致谢、参考文献、附录、作者简介均“另起一页”"
    roles: [abstract_title_zh, abstract_title_en, toc_title, chapter, references_title, ack_title, appendix_title, end_title]
  table_span:
    source: "模板表格批注：表需要转页接排时，随后各页重复表的编号，编号后跟表题和“（续）”，且续表均应重复表头"

manual:
  - {text: "封面、扉页、英文扉页：论文题名等字体字号见模板封面批注（封面“硕士学位论文”隶书初号；论文题目黑体 / Times New Roman 一号居中；作者、导师、专业类别宋体三号，研究方向宋体小二或四号等）。", source: "模板封面批注"}
  - {text: "参考文献悬挂缩进：编号 1-9 悬挂缩进 0.6 厘米，编号 10-99 悬挂缩进 0.74 厘米，编号 100 以上悬挂缩进 0.9 厘米；示例遵循 GB/T 7714-2015。", source: "模板参考文献批注"}
  - {text: "表的编排采用国际通行的三线表；表名中不允许使用标点符号，表名后不加标点；表注、数据来源行格式见 table_source。", source: "模板表格批注"}
  - {text: "图由两个或两个以上分图组成时，各分图分别以 (a)、(b)、(c)……作为图序并有分图名，直接列在各自分图正下方，主图名列在所有分图下方正中。", source: "模板图批注"}
  - {text: "公式分章编号，编号置于括号内，如 (1.1)，右端对齐，与公式间以“……”连接；包含公式的段落行间距可设置为最小值20磅，以保证公式完整显示。", source: "模板公式批注"}
  - {text: "题序与标题间空 1 格；摘要、目录、结论、致谢、附录标题中间空两个汉字空格或 4 个半角空格；结论前面不加章编号；标题均需设置对应的大纲级别。", source: "模板各标题批注"}
  - {text: "英文摘要段落中的英文标点符号后面应有一个半角空格；注意排版，不要在页面底部留下大片空白。", source: "模板英文摘要及正文批注"}
