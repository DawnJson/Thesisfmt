  paper: A4
  margins_cm: {top: 2.5, bottom: 2.5, left: 2.5, right: 2.5}
  header_distance_cm: 1.5
  footer_distance_cm: 1.75

page_numbers:
  source: "模板批注：页码 Times New Roman，小五号居中；摘要、Abstract 用罗马数字（大写）取自模板目录示例格式（批注未规定）"
