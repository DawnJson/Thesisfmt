manual:
  - {text: "论文题目用二号黑体；全文行距设置值28磅。", source: "《规范化要求》二（五）"}
  - {text: "中文关键词选取3-4个，之间用“；”分隔，最后一个关键词后不标注符号；英文关键词之间用空格分隔（空两格）。", source: "《规范化要求》一（二）3、4"}
  - {text: "各级标题序号：一、二、三……；（一）（二）（三）……；1.2.3.……；（1）（2）（3）……；① ② ③……，各级序号不得混用；目录不少于三级，致谢和参考文献不编入目录序号。", source: "《规范化要求》一（二）2、二（四）"}
  - {text: "文中的附图、表格统一编排序号并赋予图名、表名；表内文字连续重复时不可用“同上”；表内数字使用同一计量单位时，可将单位提出置于圆括号内。", source: "《规范化要求》二（三）"}
  - {text: "引用文献时不作注释（脚注、尾注），在引用处加括号注明作者姓名、出版年份、必要时页码；参考文献按正文中出现的先后次序列于文后，序号用方括号数字，先中文后英文，每条以“.”结束，按 GB/T 7714 类著录。", source: "《规范化要求》一（二）5.5、五"}
  - {text: "公式用公式编辑器编辑，一般居中；有编号的公式顶格放置，编号加圆括号居右，公式与编号之间不加虚线；较长公式在等号或加减乘除符号处转行，符号写在行首。", source: "《规范化要求》二（七）"}
  - {text: "致谢篇幅一般不超过一个页码；字数以8000字为宜（不含参考文献）。", source: "《规范化要求》一（二）5.4、二（一）"}
  - {text: "装订顺序：封面、原创声明、目录、题目与摘要及关键词（中英文）、正文、参考文献、附录、其他材料；A4纸印制。", source: "《规范化要求》二（六）"}
