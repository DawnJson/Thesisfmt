manual:
- text: 摘要页、目录页、正文页的页码奇偶页位置注意区别；全文双面打印。
  source: 模板说明（摘要页后）
- text: 摘要正文不超过 600 字；摘要一般不用图、表、化学结构式、非公知公用的符号和术语；摘要和关键词之间适当空行。
  source: 模板说明（摘要）
- text: 关键词应从“汉语主题词表”中摘选，自行设计的关键词须在右上角标注 * 并在该页页脚注明“*表示非汉语主题词”；英文关键词每个词组第一个字母大写、其余小写。
  source: 模板说明（关键词）
- text: 英文摘要正文使用齐头式，每段开头不空格，每段之间空一行。
  source: 模板说明（ABSTRACT）
- text: 图、表、公式等与正文之间间隔 0.5 行。
  source: 模板说明（正文）
- text: 图中用字一般为五号，排列过密时可小于五号但不得小于七号；表中用字为五号，排列过密时可小于五号但不小于七号；图、表若有附注，采用英文小写字母顺序编号，附注写在图或表的下方。
  source: 模板说明（图 (4)、表 (5)）
- text: 续表均应重复表头和关于单位的陈述；表格必须通栏，宽度与正文版面平齐。
  source: 模板说明（表 (1)(6)）
- text: 图、表引用他人内容须注明出处；图应有自明性；插图须紧跟文述，一般应先见图号再见图；分图用 (a)、(b)、(c) 编号，分题注在各自分图正下方，总题注在所有分图下方正中。
  source: 模板说明（图 (1)(3)(6)(8)）
- text: 公式应另起一行居中编排；公式后注明编号，靠右写在公式末，中间不加空格或虚线；公式解释以“式中：”左起顶格。
  source: 模板说明（公式 (1)(2)(3)）
- text: 致谢字数不超过 1000 字。
  source: 模板说明（致谢）
- text: 参考文献一般 10 篇以上，以近 5 年文献为主；引用处用右上角方括号加阿拉伯数字标注并与文献序号对应；引用过的文献必须著录，未引用的不得出现；著录格式符合 GB/T 7714-2015，范例采用五号；英文文献标点用半角、中文文献用全角。
  source: 模板说明（参考文献）
- text: 附录标题各占一行，按一级标题编排；每个附录一般另起一页，多个较短附录可接排。
  source: 模板说明（附录）
