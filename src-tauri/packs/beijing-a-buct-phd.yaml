    body_first: 1
manual:
- text: 关键词 3-8 个，另起一行排在摘要左下方，中文关键词用“，”分隔，句末不加标点；英文关键词“KEY WORDS：”后小写。规范未规定英文关键词的分隔符，故不启用关键词检查。
  source: 《北京化工大学研究生学位论文撰写规范（修订）》（校教发〔2017〕39号）二.5、三.2(4)、三.3(3)
- text: 摘要字数：硕士论文 500 字左右，博士论文 1500 字左右；英文摘要应与中文摘要内容一致。
  source: 《北京化工大学研究生学位论文撰写规范（修订）》（校教发〔2017〕39号）二.4(3)
- text: 英文论文题目全部采用大写字母，可分成 1-3 行居中打印；英文摘要每段开头留四个字符空格；“ABSTRACT”与“KEY WORDS：”的上下空行按规范执行。
  source: 《北京化工大学研究生学位论文撰写规范（修订）》（校教发〔2017〕39号）三.3
- text: 图、表编号建议分章依序编排（如图 1-1、表 2-2）；图中标注、图题、表中标注、表题采用中英文对照。
  source: 《北京化工大学研究生学位论文撰写规范（修订）》（校教发〔2017〕39号）三.7、三.8
- text: 公式另起一行居中横排，公式与编号之间用“……”连接；较长的公式只可在符号处（+、-、*、/、≤、≥等）转行。
  source: 《北京化工大学研究生学位论文撰写规范（修订）》（校教发〔2017〕39号）三.9
- text: 附录依序编排为附录 1，附录 2……，附录中的图表公式另编序号，与正文分开；附录置于参考文献之后，页码与正文连续。
  source: 《北京化工大学研究生学位论文撰写规范（修订）》（校教发〔2017〕39号）二.11、三.11
- text: 注释作为脚注在页下分散著录。
  source: 《北京化工大学研究生学位论文撰写规范（修订）》（校教发〔2017〕39号）二.10
- text: 参考文献的著录格式按 GB/T 7714-2015 著录。
  source: 《北京化工大学研究生学位论文撰写规范（修订）》（校教发〔2017〕39号）三.10
