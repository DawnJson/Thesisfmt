manual:
  - {text: "图、表、公式等与正文之间要有一行的间距。", source: "《硕士学位论文书写指南（专业型）》“有关图、表等”"}
  - {text: "文中的图、表、附注、公式一律采用阿拉伯数字分章（或连续）编号，如图2-5，表3-2，公式(5-1)；若图或表中有附注，采用英文小写字母顺序编号，附注写在图或表的右下方。", source: "《硕士学位论文书写指南（专业型）》“有关图、表等”"}
  - {text: "公式的编号用括号括起写在右边行末，其间不加虚线。", source: "《硕士学位论文书写指南（专业型）》“有关图、表等”(3)"}
  - {text: "表中参数应标明量和单位的符号；图中的术语、符号、单位等应同文字表述所用一致。", source: "《硕士学位论文书写指南（专业型）》“有关图、表等”"}
  - {text: "引用的文献在正文中用方括号和阿拉伯数字按顺序以右上角标形式标注在引用处；参考文献著录格式应遵循 GB/T 7714-2015。", source: "《硕士学位论文书写指南（专业型）》“参考文献”"}
  - {text: "题名一般不宜超过20字，外文题名一般不宜超过 10 个实词。", source: "《硕士学位论文书写指南（专业型）》“题名”"}
  - {text: "严格执行 GB3100～3102：93 有关量和单位的规定；单位名称可用国际通用符号或中文名称，但全文应统一。", source: "《硕士学位论文书写指南（专业型）》“量和单位”"}
