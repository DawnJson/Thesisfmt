  section_3:
    source: "《学位论文编写格式》3.5 四级标题：楷体小四加粗无缩进，多倍行距 1.25，段前 12 磅，段后 6 磅"
    cn_font: 楷体
    size: 小四
    bold: true
    line: {rule: auto, value: 1.25}
    before: 12
    after: 6
    first_line_chars: 0
  body:
    source: "《学位论文编写格式》3.5 段落文字：宋体小四号（英文用 Times New Roman 体小四号），两端对齐书写，段落首行左缩进 2 个汉字符，多倍行距 1.25"
