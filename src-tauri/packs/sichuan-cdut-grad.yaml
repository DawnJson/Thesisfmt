  org: 成都理工大学
  kind: university
  category: 研究生
  verified: true

page:
  source: "《学位论文编写格式》第3章 3.1：A4（210×297）；上、下 2.54cm，左、右 3.17cm，页眉 1.5cm、页脚 1.75cm，装订线 0cm"
  paper: A4
  margins_cm: {top: 2.54, bottom: 2.54, left: 3.17, right: 3.17}
  header_distance_cm: 1.5
  footer_distance_cm: 1.75

page_numbers:
  source: "《学位论文编写格式》2.6.2.3：页码位置居于页脚居中，封面、扉页、独创性声明等不编页码；绪论/引言起用阿拉伯数字；3.1：页码 Times New Roman 体，小五，居中（摘要大写罗马、目录小写罗马分编，见 manual，故不设 front_format）"
  body_format: decimal
  footer_align: center
  footer_latin_font: Times New Roman
  footer_size: 小五
  cover_no_number: true

headers:
  source: "《学位论文编写格式》3.1：页眉宋体小五居中，Abstract 部分用 Times New Roman 体小五；2.6.3：页眉从中文摘要开始，奇偶页不同（奇数页为章标题，偶数页为学位论文名称，内容见 manual）"
  content: chapter_title
  align: center
  cn_font: 宋体
  latin_font: Times New Roman
  size: 小五

