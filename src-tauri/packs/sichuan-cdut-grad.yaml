    after: 3
  section_1:
    source: "《学位论文编写格式》3.5 二级标题：黑体小三加粗无缩进，段前 18 磅，段后 12 磅，1.5 倍行距"
    cn_font: 黑体
    size: 小三
    bold: true
    line: {rule: auto, value: 1.5}
    before: 18
    after: 12
    first_line_chars: 0
  section_2:
    source: "《学位论文编写格式》3.5 三级标题：黑体四号无缩进，段前 12 磅，段后 9 磅，多倍行距 1.25"
    cn_font: 黑体
    size: 四号
    line: {rule: auto, value: 1.25}
