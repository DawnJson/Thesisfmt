manual:
  - {text: "校级规定要求各二级学院在校定规范基础上制定本专业的毕业设计（论文）格式要求；本包只依据电子信息工程学院的格式实例，其他学院请以本学院要求为准。", source: "《沈阳航空航天大学本科毕业设计（论文）工作规定》第十五条"}
  - {text: "理工科专业参考文献 10 篇以上、外文文献 1 篇以上；经管类专业参考文献 15 篇以上、外文文献 1 篇以上。", source: "《沈阳航空航天大学本科毕业设计（论文）工作规定》第十五条 2.（4）"}
  - {text: "毕业设计（论文）装订顺序：封面、内封、任务书（理工类）、中文摘要及关键词、外文摘要及关键词、目录、正文、参考文献、致谢、附录。", source: "《沈阳航空航天大学本科毕业设计（论文）工作规定》第十五条 1.（1）"}
