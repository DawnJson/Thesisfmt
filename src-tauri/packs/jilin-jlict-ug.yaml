manual:
- text: 题目不超过 25 字，不得使用标点符号，不设副标题（封面题目黑体、小二）。
  source: 规范 1.1；封面题目注「黑体，小二，不宜超过25字」
- text: 正文字数：工程设计类不少于 1.5 万字，研究类不少于 2 万字。
  source: 规范 2.1
- text: 页眉：奇数页为“吉林化工大学本科毕业论文”（设计类按所在学院模板），偶数页为“学生姓名：毕业论文题目”，宋体五号居中。
  source: 规范 2.2
- text: 参考文献一般 10～15 篇，其中外文不少于 3 篇，学术期刊文献不少于 7 篇；序号顶格、置于方括号内，换行时与作者名第一个字对齐。
  source: 规范 1.6、3.4.3
- text: 正文引用编号用方括号和阿拉伯数字以右上角标形式标注，方括号及序号为 Times New Roman、小四；不得置于各级标题处。
  source: 规范 3.4.2
- text: 公式必须用公式编辑器编辑，缩进 2 个汉字，序号按章编号并在行末列出，公式上下与正文各隔一空行。
  source: 规范 3.3.2
- text: 图居中排列，与上文留一行空格，版式为“上下型”或“嵌入型”，不得“浮于文字之上”；图内文字宋体五号。
  source: 规范 3.1.2
- text: 表格不加左、右边线，居中排列，与下文留一行空格；表名中不允许使用标点符号。
  source: 规范 3.2.2
- text: “结论”“致谢”标题格式同章标题（黑体小二居中，1.5 倍行距，段后 11 磅），标题“摘要”“结论”“致谢”中间留两个字的空格。
  source: 规范「摘要」「结论」「致谢」书写格式说明
- text: 单面打印，材料前后加透明塑料薄膜，左侧打孔并用塑料压条装订。
  source: 规范 4.3
